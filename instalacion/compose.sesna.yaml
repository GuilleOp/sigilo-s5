# Ventanilla única y enrutador de la SESNA en producción. No se edita: todo llega por .env y config/,
# que genera ./sigilo-sesna instalar. Ver docs/instalacion-sesna.md y docs/seguridad-produccion.md.
#   enrutador     ventanilla única (la web pública), enrutador ciego, directorio y bitácora nacional,
#                 en 127.0.0.1:8790 del equipo
#   tls           (perfil «tls») Caddy con HTTPS en 443, sin registro de accesos
#   evaluador     (perfil «corroboracion») evaluador OPRF; mejor lo opera otra institución (ADR 0006)
#   indice        (perfil «corroboracion») índice de coincidencias; lo mismo
#   herramientas  (perfil «herramientas») el CLI sigilo-sesna; no se queda corriendo
# Los nodos se publican en el directorio con https://; el enrutador no arranca en producción con un
# nodo en http:// (salvo SIGILO_ROUTER_ALLOW_HTTP_NODES=1 en una red privada cifrada).

name: sigilo-sesna

x-hardening: &hardening
  user: '${SIGILO_UID:-1000}:${SIGILO_GID:-1000}'
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  mem_limit: 512m
  pids_limit: 128
  cpus: 1.0
  ulimits:
    nofile:
      soft: 4096
      hard: 4096
  restart: unless-stopped

services:
  enrutador:
    <<: *hardening
    image: ${SIGILO_IMAGEN_ENRUTADOR:-ghcr.io/guilleop/sigilo-enrutador:${SIGILO_VERSION:-1.1.0}}
    # El relevo admite hasta 256 MiB de sobres en vuelo, con unas tres copias en memoria cada uno.
    mem_limit: 1536m
    pids_limit: 256
    cpus: 2.0
    # Lo genera ./sigilo-sesna instalar (Compose ≥ 2.24 admite que aún no exista).
    env_file:
      - path: ./config/enrutador.env
        required: false
    volumes:
      - ./datos:/data
    ports:
      - '${SIGILO_PUERTO_ENRUTADOR:-127.0.0.1:8790}:8790'
    networks:
      - interna
      - salida

  tls:
    <<: *hardening
    profiles:
      - tls
    image: ${SIGILO_IMAGEN_CADDY:-caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    mem_limit: 256m
    cpus: 0.5
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    environment:
      SIGILO_DOMINIO: ${SIGILO_DOMINIO:-}
      SIGILO_CORREO_TLS: ${SIGILO_CORREO_TLS:-}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/data
      - ./tls/propio:/tls/propio:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /config:rw,noexec,nosuid,nodev,size=8m
    ports:
      - '80:8080'
      - '443:8443'
    depends_on:
      enrutador:
        condition: service_healthy
    networks:
      - interna
      - salida

  evaluador:
    <<: *hardening
    profiles:
      - corroboracion
    image: ${SIGILO_IMAGEN_EVALUADOR:-ghcr.io/guilleop/sigilo-evaluador:${SIGILO_VERSION:-1.1.0}}
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./corroboracion/evaluador:/data
    # Sin puerto en el equipo ni salida a internet (H16, H17): llega el paso de la ventanilla.
    networks:
      - interna

  indice:
    <<: *hardening
    profiles:
      - corroboracion
    image: ${SIGILO_IMAGEN_INDICE:-ghcr.io/guilleop/sigilo-indice:${SIGILO_VERSION:-1.1.0}}
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./corroboracion/indice:/data
    networks:
      - interna

  herramientas:
    <<: *hardening
    profiles:
      - herramientas
    restart: 'no'
    image: ${SIGILO_IMAGEN_ENRUTADOR:-ghcr.io/guilleop/sigilo-enrutador:${SIGILO_VERSION:-1.1.0}}
    entrypoint: ['node', '/app/tools/sigilo/src/cli.ts']
    # Los archivos que se nombran en los comandos se buscan en la carpeta de la instalación.
    working_dir: /sigilo
    environment:
      SIGILO_INSTALL_DIR: /sigilo
    volumes:
      - .:/sigilo
    networks:
      - salida

networks:
  # Entre Caddy, el enrutador y la corroboración; sin salida a internet.
  interna:
    internal: true
  # El enrutador habla con los nodos de los estados por https.
  salida: {}
