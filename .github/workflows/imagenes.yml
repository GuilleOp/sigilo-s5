# Imágenes genéricas de SIGILO en GHCR (ghcr.io/guilleop/sigilo-<servicio>), para linux/amd64 y
# linux/arm64, con cada etiqueta v* (y a mano con workflow_dispatch). Genéricas: no traen llaves de
# ningún nodo; la web lee las de su nodo en tiempo de ejecución (/config/sigilo.json, ADR 0011).
# Seguridad (H15): acciones fijadas por SHA del commit (el comentario dice su versión; Dependabot
# las actualiza), SBOM y procedencia (SLSA) adjuntas por build-push-action y firma sin llave de
# cosign (OIDC de GitHub, registrada en Rekor). Los compose de producción fijan la imagen por digesto.
name: imagenes

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión que se publica (mayor.menor.parche, sin «v»)'
        required: true

permissions:
  contents: read

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Firma sin llave de cosign y procedencia: token OIDC de GitHub.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: nodo
            perfil_web: panel
          - servicio: enrutador
            perfil_web: ventanilla
          - servicio: testigo
            perfil_web: completo
          - servicio: evaluador
            perfil_web: completo
          - servicio: indice
            perfil_web: completo
    env:
      IMAGEN: ghcr.io/guilleop/sigilo-${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versión
        id: version
        env:
          ENTRADA: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          version="${ENTRADA:-${REF#v}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}$'; then
            echo "Versión inválida: $version" >&2
            exit 1
          fi
          echo "valor=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=raw,value=${{ steps.version.outputs.valor }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.valor }}
          labels: |
            org.opencontainers.image.title=sigilo-${{ matrix.servicio }}
            org.opencontainers.image.licenses=CC-BY-NC-4.0
            org.opencontainers.image.version=${{ steps.version.outputs.valor }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.servicio }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Sin contexto `node-keys`: la etapa por omisión trae `null` (imagen sin llaves).
          build-args: |
            SIGILO_WEB_PROFILE=${{ matrix.perfil_web }}
            SIGILO_VERSION=${{ steps.version.outputs.valor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Firma sin llave (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGEN}@${DIGEST}"

      - name: Digesto para los compose de producción
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          echo "${IMAGEN}:${VERSION}@${DIGEST}" | tee "digesto-${{ matrix.servicio }}.txt"
          {
            echo "### sigilo-${{ matrix.servicio }} ${VERSION}"
            echo '```'
            echo "${IMAGEN}@${DIGEST}"
            echo '```'
            echo "Verificar: cosign verify ${IMAGEN}@${DIGEST} --certificate-identity-regexp '^https://github.com/GuilleOp/sigilo-s5/' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digesto-${{ matrix.servicio }}
          path: digesto-${{ matrix.servicio }}.txt
          retention-days: 90
