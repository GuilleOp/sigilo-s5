# Integración continua: formato, lint, tipos, pruebas y build de la web en cada push y pull request.
# Seguridad (H15): las acciones se fijan por SHA del commit (el comentario dice su versión; Dependabot
# las actualiza), se verifican las firmas del registro de npm y se publica el SBOM (CycloneDX) de las
# dependencias de producción.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Versión mínima soportada (.nvmrc) y la más reciente: el SQLite integrado difiere entre ambas.
    strategy:
      matrix:
        node-version: ['22.18', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Seguridad: falla si una dependencia de producción tiene una vulnerabilidad alta o crítica.
      - run: npm audit --omit=dev --audit-level=high
      # Seguridad: los paquetes instalados tienen firma y procedencia válidas del registro.
      - run: npm audit signatures
      - name: SBOM de las dependencias de producción
        if: matrix.node-version == '22.18'
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.node-version == '22.18'
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Las pruebas del validador abren Chromium con Playwright.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run data:test
      - run: npm run build -w @sigilo/web

  e2e:
    runs-on: ubuntu-latest
    # Evita ejecuciones colgadas si la instalación de dependencias del sistema se atasca.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Las llaves privadas no se versionan: en CI se generan unas nuevas y la web se construye con
      # ellas (pretest:e2e), así coinciden con las que copia el globalSetup.
      - run: npm run keys:generate -- --force
      - run: npx tsc -p e2e/tsconfig.json
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
