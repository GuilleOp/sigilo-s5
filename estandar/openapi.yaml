          maximum: 9007199254740991
          description: Posición del evento en la cadena.
        type:
          $ref: '#/components/schemas/LedgerEventType'
        folioDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 de "sigilo/ledger/folio:" + folio; el folio no se publica.
        at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día del evento (UTC).
          examples:
            - '2026-11-05'
        actorRole:
          type: string
          enum:
            - system
            - authority
            - reporter
          description: 'Quién originó el evento: system, authority o reporter.'
        payloadDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 de la forma canónica de los datos del evento; lo identifica.
        receiptTag:
          description: 'Solo en identity.opened e identity.released: SHA-256 de "sigilo/ledger/receipt:" + authVerifier, para que la persona encuentre las aperturas y las entregas ligadas a su recibo.'
          type: string
          pattern: ^[0-9a-f]{64}$
        prevHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash del evento anterior (64 ceros en el primero).
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 de la forma canónica del evento sin este campo.
      required:
        - seq
        - type
        - folioDigest
        - at
        - actorRole
        - payloadDigest
        - prevHash
        - hash
      additionalProperties: false
      description: Evento público de la bitácora. Los eventos de un día se encadenan al cerrar el día, en orden barajado.
    SignedLedgerHead:
      type: object
      properties:
        seq:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Secuencia del último evento del último día publicado completo.
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash de ese evento.
        at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día de ese evento.
          examples:
            - '2026-11-05'
        serverKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 sobre la forma canónica de { seq, hash, at, serverKeyId }.
      required:
        - seq
        - hash
        - at
        - serverKeyId
        - signature
      additionalProperties: false
      description: Cabeza pública firmada de la bitácora.
    PublicKeySet:
      type: object
      properties:
        server:
          type: object
          properties:
            keyId:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
              examples:
                - 3f9a1c0b7d2e4a68
            signingPublicKey:
              type: string
              pattern: ^[A-Za-z0-9_-]+$
              description: Llave pública Ed25519 con la que el servidor firma comprobantes y la cabeza de la bitácora.
          required:
            - keyId
            - signingPublicKey
          additionalProperties: false
          description: Llaves del servidor.
        authority:
          type: object
          properties:
            keyId:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
              examples:
                - 3f9a1c0b7d2e4a68
            boxPublicKey:
              type: string
              pattern: ^[A-Za-z0-9_-]+$
              description: Llave pública X25519 hacia la que se cifra la identidad sellada y los mensajes del buzón.
            signingPublicKey:
              type: string
              pattern: ^[A-Za-z0-9_-]+$
              description: Llave pública Ed25519 con la que la autoridad firma sus mensajes.
          required:
            - keyId
            - boxPublicKey
            - signingPublicKey
          additionalProperties: false
          description: Llaves de la autoridad competente.
        supervisor:
          description: Llave de la autoridad supervisora (segunda llave), si hay.
          type: object
          properties:
            keyId:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
              examples:
                - 3f9a1c0b7d2e4a68
            boxPublicKey:
              type: string
              pattern: ^[A-Za-z0-9_-]+$
              description: Llave pública X25519 de la autoridad supervisora, hacia la que se cifra el sobre de escalamiento.
          required:
            - keyId
            - boxPublicKey
          additionalProperties: false
      required:
        - server
        - authority
      additionalProperties: false
      description: Llaves públicas del despliegue. El cliente las compara con las que trae fijadas para detectar una sustitución.
    PowChallenge:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          description: Reto opaco firmado por el servidor; vence a los pocos minutos.
        bits:
          type: integer
          minimum: 0
          maximum: 32
          description: Bits en cero que debe tener al inicio el digesto de la solución; 0 = sin prueba.
      required:
        - token
        - bits
      additionalProperties: false
      description: Reto de prueba de trabajo de un solo propósito.
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - bad_request
                - not_found
                - unauthorized
                - forbidden
                - conflict
                - reassignment_limit
                - payload_too_large
                - unsupported_media_type
                - rate_limited
                - proof_required
                - storage_full
                - ledger_day_full
                - internal
              description: Código estable del error.
            message:
              type: string
              description: Mensaje fijo en español; nunca incluye datos de la solicitud.
          required:
            - code
            - message
          additionalProperties: false
          description: Código y mensaje del error.
      required:
        - error
      additionalProperties: false
      description: Error con formato común. Los errores de seguimiento no distinguen si falló el folio o el recibo.
    ComplaintMode:
      type: string
      enum:
        - anonymous
        - sealed
      description: 'Modo de la denuncia: anonymous (sin identidad) o sealed (identidad cifrada que solo abre la autoridad, con registro público).'
    ComplaintStatus:
      type: string
      enum:
        - received
        - routing
        - routed
        - investigating
        - classified
        - archived
        - resolved
      description: |-
        Estatus de la denuncia en la API v1. Su lugar en el flujo de gestión y en las etapas legales está en el catálogo COMPLAINT_STATUSES.

        - `received`: Recibida. Tu denuncia llegó y está en espera de revisión.
        - `routing`: Buscando a la autoridad que debe atenderla. Estamos buscando qué autoridad debe atender tu denuncia.
        - `routed`: Turnada a la autoridad competente. La autoridad competente ya la tiene.
        - `investigating`: En investigación. La autoridad está investigando los hechos.
        - `classified`: Revisada: la autoridad decidió si la falta es grave. La autoridad ya decidió si la falta es grave o no.
        - `archived`: Archivada. Se cerró por ahora; puede reabrirse si hay nuevos elementos.
        - `resolved`: Concluida. La autoridad terminó el trámite.
    LedgerEventType:
      type: string
      enum:
        - complaint.received
        - complaint.status_changed
        - identity.opened
        - message.sent
        - evidence.discarded
        - identity.approved
        - rule.triggered
        - complaint.transferred
        - audit.signal
        - closures.imported
        - appeal.filed
        - identity.released
        - corroboration.viewed
        - corroboration.confirmed
        - corroboration.withdrawn
      description: 'Tipo de evento: recepción, cambio de estatus o trámite, apertura de identidad, mensaje, descarte de pruebas, aprobación de una apertura, regla pública cumplida, turnado a otro nodo o señal del auditor.'
    PowPurpose:
      type: string
      enum:
        - complaint
        - message
        - registration
      description: 'Propósito del reto: complaint (una denuncia con sus pruebas), message (un mensaje del buzón) o registration (una solicitud de alta de autoridad).'
    ManagementState:
      type: string
      enum:
        - received_in_inbox
        - routed
        - accepted
        - reassigned
        - returned_to_inbox
        - closed
      description: |-
        Estado del flujo de gestión del S5. Nombres y explicaciones en el catálogo MANAGEMENT_STATES.

        - `received_in_inbox`: Recibida en el buzón general. Tu denuncia llegó al buzón general del sistema. Ahí se revisa para saber qué institución debe atenderla. Todavía nadie la investiga.
        - `routed`: Turnada. Turnar significa enviar tu denuncia a la institución que puede investigarla, por ejemplo el órgano interno de control de la dependencia donde ocurrieron los hechos. Esa institución todavía tiene que aceptarla: turnada no quiere decir que ya se investiga ni que se decidió algo.
        - `accepted`: Aceptada. La institución revisó tu denuncia y aceptó que le corresponde atenderla. Desde aquí empieza la investigación y corren los plazos legales.
        - `reassigned`: Reasignada. La institución que la recibió consideró que no le corresponde y la envió a otra que sí podría atenderla. Tu folio y tu recibo siguen sirviendo igual.
        - `returned_to_inbox`: Devuelta al buzón general. La institución consideró que no le corresponde y la regresó al buzón general para que se envíe a otra. No se pierde: vuelve a turnarse.
        - `closed`: Cerrada. El trámite en el sistema terminó. El motivo de cierre explica por qué. Si se archivó por falta de elementos, puede reabrirse si aportas nuevos indicios.
    ClosureReason:
      type: string
      enum:
        - attended
        - channeled
        - inadmissible
        - insufficient_information
        - joined
        - other
      description: |-
        Motivo de cierre del flujo de gestión. Nombres y explicaciones en CLOSURE_REASONS.

        - `attended`: Atendido. La institución atendió tu denuncia: investigó y tomó una decisión, por ejemplo iniciar un procedimiento o imponer una sanción.
        - `channeled`: Canalizado. Los hechos los debe atender otra instancia fuera de este sistema (por ejemplo, una comisión de derechos humanos o una fiscalía). La institución debe decirte a dónde se envió.
        - `inadmissible`: Improcedente. La denuncia no puede tramitarse como falta administrativa ni como hecho de corrupción; por ejemplo, porque no involucra a personas servidoras públicas ni a recursos públicos.
        - `insufficient_information`: Información insuficiente. No había datos suficientes para investigar. Si tienes más información, envíala por el buzón: la denuncia puede reabrirse con nuevos indicios.
        - `joined`: Acumulado. Tu denuncia trata de los mismos hechos que otra y se juntaron en un solo expediente para investigarlas juntas. No se pierde.
        - `other`: Otro. Se cerró por un motivo distinto. La institución debe explicarlo en una nota pública que puedes leer con tu folio y tu recibo.
    LegalTrack:
      type: string
      enum:
        - administrative
        - criminal
      description: 'Vía legal: administrative (falta administrativa) o criminal (hecho de corrupción).'
    LegalStage:
      type: string
      enum:
        - investigation
        - qualification
        - report_filed
        - case_file_sent
        - evidence_hearing
        - closing_arguments
        - instruction_closed
        - resolution
        - criminal_investigation
        - intermediate_stage
        - trial
        - sentence
      description: |-
        Etapa legal de cualquiera de las dos vías. Nombres y explicaciones en LEGAL_STAGES.

        - `investigation`: Investigación. La autoridad investigadora reúne información y pruebas: pide documentos, hace requerimientos y revisa los hechos. Tu identidad sigue protegida.
        - `qualification`: Calificación de la falta. Con lo investigado, la autoridad decide si hubo una falta y si es grave o no grave. Si no encuentra elementos, archiva el expediente y debe avisarte si eres identificable. Si la califica como no grave, puedes inconformarte.
        - `report_filed`: Envío del Informe de Presunta Responsabilidad Administrativa. La autoridad investigadora escribe un informe con la falta que encontró y sus pruebas, y lo entrega a la autoridad substanciadora. Con esto empieza el procedimiento contra la persona señalada.
        - `case_file_sent`: Envío del expediente. En faltas graves y faltas de particulares, la autoridad substanciadora envía el expediente al Tribunal de Justicia Administrativa, que es quien resuelve.
        - `evidence_hearing`: Admisión y desahogo de pruebas. Se reciben y se revisan las pruebas de las partes. La persona señalada tiene derecho a defenderse.
        - `closing_arguments`: Alegatos. Las partes presentan por escrito sus últimos argumentos.
        - `instruction_closed`: Cierre de la instrucción. Ya no se reciben más pruebas ni argumentos: el asunto queda listo para que se resuelva.
        - `resolution`: Resolución. La autoridad resolutora decide si la persona es responsable y, en su caso, qué sanción le corresponde.
        - `criminal_investigation`: Investigación. La fiscalía investiga si los hechos son un delito y quién podría haberlo cometido.
        - `intermediate_stage`: Etapa intermedia. Ante un juez de control, la fiscalía presenta su acusación y se decide qué pruebas irán a juicio.
        - `trial`: Juicio. Un tribunal escucha a las partes y revisa las pruebas en audiencia.
        - `sentence`: Sentencia. El tribunal decide si la persona acusada es culpable o inocente y, en su caso, la pena.
    ProcedureActor:
      type: string
      enum:
        - reporter
        - inbox_operator
        - receiving_institution
        - investigating_authority
        - substantiating_authority
        - resolving_authority
        - administrative_court
        - prosecutor
        - criminal_court
      description: |-
        Quién actúa en un estado o etapa. Nombres en PROCEDURE_ACTORS.

        - `reporter`: Persona denunciante. Quien presentó la denuncia. Puede dar seguimiento con su folio y su recibo.
        - `inbox_operator`: Operadora del buzón general. Área que recibe todas las denuncias del sistema y decide a qué institución enviarlas. En la versión de pruebas del S5 es la Secretaría Ejecutiva del Sistema Nacional Anticorrupción.
        - `receiving_institution`: Institución que recibe el turno. Institución a la que se envió la denuncia, por ejemplo el órgano interno de control de una dependencia. Decide si le corresponde atenderla.
        - `investigating_authority`: Autoridad investigadora. Reúne información y pruebas para saber si hubo una falta administrativa.
        - `substantiating_authority`: Autoridad substanciadora. Conduce el procedimiento contra la persona señalada: la cita, recibe sus pruebas y sus argumentos. Es distinta de la que investigó.
        - `resolving_authority`: Autoridad resolutora. Decide si la persona es responsable y qué sanción corresponde. En faltas no graves es la propia institución; en faltas graves, el Tribunal de Justicia Administrativa.
        - `administrative_court`: Tribunal de Justicia Administrativa. Resuelve las faltas graves y las faltas de particulares, y el recurso de inconformidad en su Sala.
        - `prosecutor`: Fiscalía (Ministerio Público). Investiga los hechos que pueden ser delitos por corrupción y acusa ante un juez.
        - `criminal_court`: Juez o tribunal penal. Conduce las audiencias del proceso penal y dicta la sentencia.
    DeadlineKey:
      type: string
      enum:
        - serious_offense_start
        - archive_notification
        - information_request
        - appeal_filing
        - appeal_resolution
        - prescription_non_serious
        - prescription_serious
        - inactivity_expiry
      description: |-
        Plazo legal del catálogo DEADLINE_RULES.

        - `serious_offense_start`: Iniciar ante una posible falta grave. Cuando la autoridad conoce una conducta que podría ser falta grave, falta de particulares o acto de corrupción, tiene 30 días naturales para iniciar el procedimiento.
        - `archive_notification`: Notificar el archivo. Si la autoridad archiva la investigación por falta de elementos, debe notificarlo a las personas denunciantes identificables.
        - `information_request`: Atender un requerimiento. Quien recibe un requerimiento de la autoridad investigadora debe responder en el plazo que ésta fije, de 5 a 15 días hábiles; puede ampliarse por causa justificada.
        - `appeal_filing`: Presentar la inconformidad. Si la falta se calificó como no grave, la persona denunciante puede inconformarse. La inconformidad exige nombre, domicilio y firma autógrafa.
        - `appeal_resolution`: Resolver la inconformidad. La Sala del Tribunal tiene 30 días hábiles para resolver la inconformidad.
        - `prescription_non_serious`: Prescripción de faltas no graves. La facultad para sancionar una falta no grave prescribe en 3 años. La calificación de la falta interrumpe la prescripción.
        - `prescription_serious`: Prescripción de faltas graves. La facultad para sancionar una falta grave o una falta de particulares prescribe en 7 años. La calificación de la falta interrumpe la prescripción.
        - `inactivity_expiry`: Caducidad por inactividad. Admitido el Informe de Presunta Responsabilidad Administrativa, el procedimiento no puede detenerse más de 6 meses sin causa justificada; si ocurre, se decreta la caducidad de la instancia a solicitud del presunto infractor. No aplica durante la investigación.
    DeadlineUnit:
      type: string
      enum:
        - natural_days
        - business_days
        - months
        - years
      description: 'Unidad del plazo: días naturales, días hábiles, meses o años.'
    DeadlineStatus:
      type: string
      enum:
        - running
        - due_soon
        - overdue
      description: 'Situación de un plazo: running (en curso), due_soon (por vencer) u overdue (vencido).'
    TurnSemaphoreStatus:
      type: string
      enum:
        - a_tiempo
        - por_vencer
        - vencida
      description: 'Semáforo de turnado del S5: a_tiempo, por_vencer (1 día hábil sin turnar o sin aceptar) o vencida (2 días hábiles). Umbrales en TURN_SEMAPHORE.'
    TurnWait:
      type: string
      enum:
        - routing
        - acceptance
      description: 'Qué espera la denuncia: routing (en el buzón general, sin turnar o devuelta) o acceptance (turnada o reasignada, sin aceptar).'
    ProcedureAction:
      type: string
      enum:
        - received
        - routed
        - accepted
        - reassigned
        - returned_to_inbox
        - stage_advanced
        - closed
        - conflict_excused
        - conflict_justified
        - transferred
        - appeal_filed
      description: 'Acción del trámite: recepción, turno, aceptación, reasignación, devolución al buzón general, avance de etapa legal, cierre, excusa o justificación ante un posible conflicto de interés, turnado a otro nodo o inconformidad de la persona denunciante.'
    OffenseSeverity:
      type: string
      enum:
        - non_serious
        - serious
        - private_party
        - crime
      description: 'Gravedad de la conducta: non_serious (falta no grave), serious (grave), private_party (de particulares) o crime (delito).'
    EscalationRuleKey:
      type: string
      enum:
        - escalation.grave-stalled
        - escalation.archive-unnotified
        - escalation.conflict
        - escalation.archive-signals
        - escalation.downgrade-signals
        - escalation.declined-serious
        - escalation.conflict-justified
        - escalation.transfer-unconfirmed
        - alert.turn-overdue
        - alert.prescription-12m
        - alert.prescription-6m
        - alert.prescription-3m
        - alert.inactivity-warning
        - alert.inactivity-expiry
        - alert.expiry-warning
        - alert.expiry-reached
      description: Regla pública de escalamiento o de alerta del catálogo ESCALATION_RULES.
    RuleEffect:
      type: string
      enum:
        - escalate
        - alert
      description: 'Efecto de la regla: escalate (entrega el sobre de escalamiento a la supervisora) o alert (solo avisa).'
    AuthorityFunction:
      type: string
      enum:
        - intake
        - investigation
        - supervision
        - substantiation
        - operation
      description: 'Función de la cuenta: intake (recepción y turnado), investigation (investigación), supervision (supervisión), substantiation (substanciación y resolución) u operation (operación del nodo: solo solicitudes de alta).'
    AccountId:
      type: string
      pattern: ^acct-[0-9a-f]{16}$
      description: Seudónimo estable y aleatorio de una cuenta de la autoridad; nunca su nombre. Es el actor que queda en la bitácora.
      examples:
        - acct-5f0c2a9d1e7b3c44
    RegistrationRequest:
      type: object
      properties:
        institutionName:
          type: string
          minLength: 2
          maxLength: 300
          description: Nombre oficial de la institución.
        stateCode:
          anyOf:
            - type: string
              pattern: ^(?:\d{2}|state\.[a-z0-9]+(?:-[a-z0-9]+)*)$
              description: 'Entidad federativa: clave INEGI de dos dígitos o clave `state.*` de una entidad sintética sin clave INEGI.'
              examples:
                - '22'
            - type: 'null'
          description: Entidad de la institución; null si es federal.
        governmentLevel:
          type: string
          enum:
            - federal
            - estatal
            - municipal
          description: 'Orden de gobierno: federal, estatal o municipal.'
        role:
          type: string
          enum:
            - investigating
            - supervisory
            - prosecution
          description: 'Papel: investigating (investiga faltas), supervisory (supervisa) o prosecution (fiscalía).'
        laws:
          minItems: 1
          maxItems: 2
          type: array
          items:
            type: string
            enum:
              - LGRA
              - CPF
          description: Leyes de las conductas que conoce.
        supervisorId:
          anyOf:
            - type: string
              pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable de la autoridad.
              examples:
                - authority.oic-iffe
            - type: 'null'
          description: Autoridad supervisora en el directorio, si tiene.
        applicant:
          type: object
          properties:
            fullName:
              type: string
              minLength: 2
              maxLength: 120
              description: Nombre de quien solicita.
            position:
              type: string
              minLength: 2
              maxLength: 200
              description: Cargo de quien solicita.
            appointment:
              type: string
              minLength: 2
              maxLength: 200
              description: Número y fecha del oficio de nombramiento.
          required:
            - fullName
            - position
            - appointment
          additionalProperties: false
          description: Quien solicita el alta, con su cargo y nombramiento.
        people:
          minItems: 1
          maxItems: 12
          type: array
          items:
            type: object
            properties:
              fullName:
                type: string
                minLength: 2
                maxLength: 120
                description: Nombre de la persona que tendrá cuenta.
              functions:
                minItems: 1
                maxItems: 2
                type: array
                items:
                  $ref: '#/components/schemas/AuthorityFunction'
                description: 'Funciones de la cuenta: una sola, o intake e investigation juntas (recepción e investigación en la misma área). substantiation, supervision y operation nunca se combinan.'
                examples:
                  - - investigation
                  - - intake
                    - investigation
            required:
              - fullName
              - functions
            additionalProperties: false
            description: Persona de la institución que tendrá cuenta en el panel.
          description: Personas de la institución que tendrán cuenta.
        padlock:
          type: object
          properties:
            keyId:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
              examples:
                - 3f9a1c0b7d2e4a68
            boxPublicKey:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+$
              description: Llave pública X25519 de la autoridad.
            signingPublicKey:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+$
              description: Llave pública Ed25519 de la autoridad.
          required:
            - keyId
            - boxPublicKey
            - signingPublicKey
          additionalProperties: false
          description: 'Candado de la autoridad: solo sus llaves públicas, nunca la privada.'
      required:
        - institutionName
        - stateCode
        - governmentLevel
        - role
        - laws
        - supervisorId
        - applicant
        - people
        - padlock
      additionalProperties: false
      description: Solicitud de alta de una institución en el nodo.
    RegistrationReceipt:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^ALTA-[0-9A-F]{12}$
          description: Folio de la solicitud de alta.
          examples:
            - ALTA-3F2A9C01B7E4
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{4}( [0-9a-f]{4}){3}$
          description: 'Huella del candado: 16 caracteres hexadecimales del SHA-256 de las dos llaves públicas, en grupos de 4.'
          examples:
            - 3f2a 9c01 b7e4 55d0
      required:
        - requestId
        - fingerprint
      additionalProperties: false
      description: Folio de la solicitud y huella del candado recibido.
    RegistrationList:
      type: object
      properties:
        nodeId:
          description: Nodo de este servidor, o null sin red.
          type:
            - string
            - 'null'
        registrations:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationView'
          description: Solicitudes de la más reciente a la más antigua.
      required:
        - nodeId
        - registrations
      additionalProperties: false
    RegistrationView:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^ALTA-[0-9A-F]{12}$
          description: Folio de la solicitud de alta.
          examples:
            - ALTA-3F2A9C01B7E4
        receivedOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
          examples:
            - '2026-11-05'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          description: 'Estado: pending (pendiente), approved (aprobada) o rejected (rechazada).'
        request:
          $ref: '#/components/schemas/RegistrationRequest'
        decision:
          anyOf:
            - type: object
              properties:
                'on':
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
                  examples:
                    - '2026-11-05'
                accountId:
                  $ref: '#/components/schemas/AccountId'
                reason:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: 'null'
              required:
                - 'on'
                - accountId
                - reason
              additionalProperties: false
            - type: 'null'
          description: Quién resolvió (seudónimo de la cuenta), qué día y, si rechazó, el motivo.
        directoryEntry:
          anyOf:
            - $ref: '#/components/schemas/DirectoryAuthority'
            - type: 'null'
          description: 'Si se aprobó: entrada propuesta para el directorio, lista para agregarla, firmarla y que los testigos la cofirmen.'
      required:
        - requestId
        - receivedOn
        - status
        - request
        - decision
        - directoryEntry
      additionalProperties: false
      description: Solicitud de alta con su estado y, si ya se resolvió, quién y cuándo.
    RegistrationDecision:
      oneOf:
        - type: object
          properties:
            decision:
              type: string
              const: approve
            fingerprint:
              type: string
              pattern: ^[0-9a-f]{4}( [0-9a-f]{4}){3}$
              description: 'Huella del candado: 16 caracteres hexadecimales del SHA-256 de las dos llaves públicas, en grupos de 4.'
              examples:
                - 3f2a 9c01 b7e4 55d0
          required:
            - decision
            - fingerprint
          additionalProperties: false
        - type: object
          properties:
            decision:
              type: string
              const: reject
            reason:
              type: string
              minLength: 5
              maxLength: 500
          required:
            - decision
            - reason
          additionalProperties: false
      description: Aprobar con la huella confirmada o rechazar con un motivo.
    SignedAuthorityDirectory:
      type: object
      properties:
        directory:
          $ref: '#/components/schemas/AuthorityDirectory'
        digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 de la forma canónica de `directory`.
        operatorSignature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 de la operación sobre "sigilo/red/directory/operator/v1:" + digest.
        witnessSignatures:
          type: array
          items:
            $ref: '#/components/schemas/WitnessSignature'
          description: Cofirmas sobre "sigilo/red/directory/witness/v1:" + digest.
      required:
        - directory
        - digest
        - operatorSignature
        - witnessSignatures
      additionalProperties: false
      description: Directorio publicado con la firma de la operación y las cofirmas.
    AuthorityDirectory:
      type: object
      properties:
        format:
          type: number
          const: 1
          description: Versión del formato del directorio.
        serial:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Número de versión del directorio; crece en uno con cada cambio.
        issuedOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día de emisión de esta versión.
          examples:
            - '2026-11-05'
        validUntil:
          description: Último día en que esta versión se acepta (H10). La operación reemite el directorio antes; una copia vieja deja de verificar.
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          examples:
            - '2026-11-05'
        previousDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 'Digesto de la versión anterior (64 ceros en la primera): las versiones forman una cadena.'
        operator:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 300
              description: Quién opera la ventanilla única.
            signingKeyId:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
              examples:
                - 3f9a1c0b7d2e4a68
            signingPublicKey:
              type: string
              pattern: ^[A-Za-z0-9_-]+$
              description: 'Llave Ed25519 de la operación: firma el directorio y la cabeza nacional.'
          required:
            - name
            - signingKeyId
            - signingPublicKey
          additionalProperties: false
          description: Operación de la ventanilla única y del enrutador.
        nodes:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/DirectoryNode'
          description: Nodos de la red.
        authorities:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/DirectoryAuthority'
          description: Autoridades registradas en la ventanilla única.
        observers:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryObserver'
          description: Observadores.
        witnessPolicy:
          $ref: '#/components/schemas/WitnessPolicy'
        corroboration:
          description: Servicios de la corroboración ciega (ADR 0006) con la llave pública del evaluador OPRF; si falta, la red no ofrece corroboración.
          $ref: '#/components/schemas/DirectoryCorroboration'
        functionTables:
          description: 'Tabla de funciones de cada nodo, firmada por el nodo: una por entidad y otra para el orden federal. Una entidad sin tabla no tiene nodo y no recibe denuncias estatales por la ventanilla.'
          maxItems: 40
          type: array
          items:
            $ref: '#/components/schemas/SignedFunctionTable'
      required:
        - format
        - serial
        - issuedOn
        - previousDigest
        - operator
        - nodes
        - authorities
        - observers
        - witnessPolicy
      additionalProperties: false
      description: 'Directorio de autoridades: cada versión la firma la operación y la cofirman m de n testigos.'
    DirectoryNode:
      type: object
      properties:
        id:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nombre del nodo.
        baseUrl:
          type: string
          pattern: ^https?:\/\/[^\s/?#]+$
          description: Origen público del nodo (esquema, host y puerto, sin ruta).
          examples:
            - https://denuncias.queretaro.example
        boxKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        boxPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Llave pública X25519 del nodo: destinataria de los sobres de red.'
        signingKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        signingPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Llave pública Ed25519 del nodo: firma la cabeza de su bitácora, su registro y, si es testigo, sus cofirmas.'
      required:
        - id
        - name
        - baseUrl
        - boxKeyId
        - boxPublicKey
        - signingKeyId
        - signingPublicKey
      additionalProperties: false
      description: 'Nodo de la red: el de una entidad (lo opera su SESEA o su contraloría) o el federal. No hay nodo común: cada entidad monta el suyo.'
    DirectoryAuthority:
      type: object
      properties:
        id:
          type: string
          pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable de la autoridad.
          examples:
            - authority.oic-iffe
        name:
          type: string
          minLength: 1
          maxLength: 300
          description: Nombre de la autoridad.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        governmentLevel:
          type: string
          enum:
            - federal
            - estatal
            - municipal
          description: 'Orden de gobierno: federal, estatal o municipal.'
        stateCode:
          anyOf:
            - type: string
              pattern: ^(?:\d{2}|state\.[a-z0-9]+(?:-[a-z0-9]+)*)$
              description: 'Entidad federativa: clave INEGI de dos dígitos o clave `state.*` de una entidad sintética sin clave INEGI.'
              examples:
                - '22'
            - type: 'null'
          description: Entidad de la autoridad; null si es federal.
        role:
          type: string
          enum:
            - investigating
            - supervisory
            - prosecution
            - inbox
          description: 'Papel: investigating (investiga faltas), supervisory (supervisa y recibe escalamientos), prosecution (fiscalía de hechos de corrupción) o inbox (buzón general del nodo: recibe lo que no tiene autoridad competente en el directorio y lo turna; Bases de la PDN, arts. 56 y 58).'
        competence:
          $ref: '#/components/schemas/AuthorityCompetence'
        keyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        boxPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Llave pública X25519 hacia la que se cifran hechos, identidad y mensajes.
        signingPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Llave pública Ed25519 con la que la autoridad firma sus mensajes.
        supervisorId:
          anyOf:
            - type: string
              pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable de la autoridad.
              examples:
                - authority.oic-iffe
            - type: 'null'
          description: Autoridad supervisora que recibe el sobre de escalamiento (ADR 0007), o null.
        validFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Primer día de vigencia de las llaves.
          examples:
            - '2026-11-05'
        validUntil:
          anyOf:
            - type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
              examples:
                - '2026-11-05'
            - type: 'null'
          description: Último día de vigencia de las llaves, o null si no tiene fecha de término.
      required:
        - id
        - name
        - nodeId
        - governmentLevel
        - stateCode
        - role
        - competence
        - keyId
        - boxPublicKey
        - signingPublicKey
        - supervisorId
        - validFrom
        - validUntil
      additionalProperties: false
      description: Autoridad del directorio con su competencia y sus llaves públicas.
    AuthorityCompetence:
      type: object
      properties:
        governmentLevels:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - federal
              - estatal
              - municipal
            description: 'Orden de gobierno: federal, estatal o municipal.'
          description: Órdenes de gobierno de los entes que atiende.
        stateCodes:
          type: array
          items:
            type: string
            pattern: ^(?:\d{2}|state\.[a-z0-9]+(?:-[a-z0-9]+)*)$
            description: 'Entidad federativa: clave INEGI de dos dígitos o clave `state.*` de una entidad sintética sin clave INEGI.'
            examples:
              - '22'
          description: Entidades donde actúa; vacío significa todo el país.
        entityIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Entes del catálogo que atiende de forma específica; vacío significa todos los del orden y la entidad.
        laws:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - LGRA
              - CPF
          description: 'Leyes de las conductas que conoce: LGRA (faltas administrativas) o CPF (delitos).'
      required:
        - governmentLevels
        - stateCodes
        - entityIds
        - laws
      additionalProperties: false
      description: 'Competencia declarada: con ella se propone la autoridad competente.'
    DirectoryObserver:
      type: object
      properties:
        id:
          type: string
          pattern: ^observer\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del observador.
          examples:
            - observer.cpc-queretaro
        name:
          type: string
          minLength: 1
          maxLength: 300
          description: Nombre del observador.
        kind:
          type: string
          enum:
            - cpc
            - audit-institution
            - civil-society
            - academia
          description: 'Tipo de observador: CPC, entidad de fiscalización superior, organización de la sociedad civil o academia.'
        signingKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        signingPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Llave pública Ed25519 con la que cofirma el directorio y la bitácora nacional.
      required:
        - id
        - name
        - kind
        - signingKeyId
        - signingPublicKey
      additionalProperties: false
      description: 'Observador: ve solo la bitácora pública y cofirma como testigo.'
    SignedFunctionTable:
      type: object
      properties:
        table:
          $ref: '#/components/schemas/FunctionTable'
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del nodo (su llave de firma del directorio) sobre "sigilo/red/function-table/v1:" + SHA-256 de la forma canónica de table.
      required:
        - table
        - signature
      additionalProperties: false
      description: 'Tabla de funciones firmada por su nodo. Viaja dentro del directorio, que firma la operación y cofirman los testigos: la operación no puede cambiarla sin la firma del estado.'
    FunctionTable:
      type: object
      properties:
        format:
          type: number
          const: 1
          description: Versión del formato de la tabla de funciones.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Nodo que declara la tabla y la firma.
          examples:
            - node.queretaro
        stateCode:
          anyOf:
            - type: string
              pattern: ^(?:\d{2}|state\.[a-z0-9]+(?:-[a-z0-9]+)*)$
              description: 'Entidad federativa: clave INEGI de dos dígitos o clave `state.*` de una entidad sintética sin clave INEGI.'
              examples:
                - '22'
            - type: 'null'
          description: Entidad que cubre la tabla; null en la tabla del nodo federal (entes del orden federal).
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Versión de la tabla; crece en uno con cada cambio.
        issuedOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día en que el nodo firmó esta versión.
          examples:
            - '2026-11-05'
        functions:
          type: object
          properties:
            intake:
              minItems: 1
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: 'Buzón general: recibe lo que no tiene autoridad en la tabla y lo turna (Bases de la PDN, arts. 56 y 58).'
            operation:
              minItems: 1
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: Quién opera el nodo y da de alta a las autoridades.
            investigation:
              minItems: 0
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: Autoridad investigadora y calificadora (LGRA, art. 3).
            substantiation:
              minItems: 0
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: Autoridad substanciadora (LGRA, art. 3).
            resolution:
              minItems: 0
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: 'Autoridad resolutora: la no grave la resuelve el órgano de control y la grave, el tribunal (LGRA, art. 3).'
            supervision:
              minItems: 0
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: Superior jerárquico que recibe los escalamientos (ADR 0007).
            prosecution:
              minItems: 0
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: 'Vía penal: fiscalía de hechos de corrupción.'
            observer:
              minItems: 0
              maxItems: 200
              type: array
              items:
                $ref: '#/components/schemas/FunctionRule'
              description: Observador ciudadano (CPC).
          required:
            - intake
            - operation
            - investigation
            - substantiation
            - resolution
            - supervision
            - prosecution
            - observer
          additionalProperties: false
          description: Reglas de cada función.
      required:
        - format
        - nodeId
        - stateCode
        - version
        - issuedOn
        - functions
      additionalProperties: false
      description: 'Tabla de funciones de un nodo: qué institución cumple cada función en su entidad, con reglas por orden de gobierno y, si hace falta, por ente. Con ella la ventanilla propone a quién va cada denuncia.'
    FunctionRule:
      type: object
      properties:
        governmentLevels:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - federal
              - estatal
              - municipal
            description: 'Orden de gobierno: federal, estatal o municipal.'
          description: Órdenes de gobierno de los entes a los que aplica la regla.
        entityIds:
          maxItems: 1000
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Entes del catálogo a los que aplica de forma específica; vacío significa todos los del orden (por ejemplo, «municipales sin OIC»). Una regla específica gana sobre una general.
        severity:
          description: Solo para faltas graves (serious) o no graves (non_serious); sin el campo, para ambas. Sirve, por ejemplo, para la resolución.
          type: string
          enum:
            - serious
            - non_serious
        holder:
          $ref: '#/components/schemas/FunctionHolder'
        legalBasis:
          description: Fundamento corto, en lenguaje claro (ley y artículo).
          type: string
          minLength: 1
          maxLength: 300
      required:
        - governmentLevels
        - entityIds
        - holder
      additionalProperties: false
      description: 'Regla: a qué entes aplica y quién cumple la función para ellos.'
    FunctionHolder:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: authority
            authorityId:
              type: string
              pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable de la autoridad.
              examples:
                - authority.oic-iffe
          required:
            - kind
            - authorityId
          additionalProperties: false
          description: Una autoridad del directorio, con sus llaves.
        - type: object
          properties:
            kind:
              type: string
              const: observer
            observerId:
              type: string
              pattern: ^observer\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable del observador.
              examples:
                - observer.cpc-queretaro
          required:
            - kind
            - observerId
          additionalProperties: false
          description: Un observador del directorio.
        - type: object
          properties:
            kind:
              type: string
              const: institution
            name:
              type: string
              minLength: 1
              maxLength: 300
              description: Nombre oficial de la institución.
          required:
            - kind
            - name
          additionalProperties: false
          description: Una institución que no recibe denuncias cifradas (por ejemplo, el tribunal que resuelve las faltas graves o quien opera el nodo).
      description: 'Quién cumple la función: autoridad, observador o institución.'
    WitnessPolicy:
      type: object
      properties:
        threshold:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Número mínimo de cofirmas válidas de testigos distintos (m).
        witnessIds:
          minItems: 1
          type: array
          items:
            type: string
            pattern: ^(?:node|observer)\.[a-z0-9]+(?:-[a-z0-9]+)*$
            description: 'Testigo: un observador o un nodo del directorio.'
            examples:
              - observer.university-ejemplo
          description: 'Testigos (n): observadores o nodos del directorio.'
      required:
        - threshold
        - witnessIds
      additionalProperties: false
      description: Política de testigos m de n.
    WitnessSignature:
      type: object
      properties:
        witnessId:
          type: string
          pattern: ^(?:node|observer)\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: 'Testigo: un observador o un nodo del directorio.'
          examples:
            - observer.university-ejemplo
        keyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del testigo.
      required:
        - witnessId
        - keyId
        - signature
      additionalProperties: false
      description: Cofirma de un testigo.
    NetworkTrustAnchor:
      type: object
      properties:
        format:
          type: number
          const: 1
          description: Versión del formato.
        operatorKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: Identificador de la llave de la operación.
          examples:
            - 3f9a1c0b7d2e4a68
        operatorSigningPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Llave pública Ed25519 de la operación.
        threshold:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Cofirmas de testigos distintos que se exigen (m).
        witnesses:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^(?:node|observer)\.[a-z0-9]+(?:-[a-z0-9]+)*$
                description: 'Testigo: un observador o un nodo del directorio.'
                examples:
                  - observer.university-ejemplo
              keyId:
                type: string
                pattern: ^[0-9a-f]{16}$
                description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
                examples:
                  - 3f9a1c0b7d2e4a68
              signingPublicKey:
                type: string
                pattern: ^[A-Za-z0-9_-]+$
                description: Llave pública Ed25519 del testigo.
            required:
              - id
              - keyId
              - signingPublicKey
            additionalProperties: false
            description: Testigo fijado.
          description: Testigos fijados (n).
        minDirectorySerial:
          description: 'Serial mínimo del directorio que se acepta (H10): fijarlo al publicar una versión que revoca llaves impide volver a una anterior.'
          type: integer
          minimum: 1
          maximum: 9007199254740991
        maxDirectoryAgeDays:
          description: Días máximos desde `issuedOn` para aceptar el directorio (H10); exige que quien verifica conozca el día.
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - format
        - operatorKeyId
        - operatorSigningPublicKey
        - threshold
        - witnesses
      additionalProperties: false
      description: 'Raíz de confianza que el navegador trae fijada: la llave de la operación y las de los testigos, nunca las de cada autoridad.'
    RelayRequest:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        to:
          type: string
          pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: 'Autoridad destino: lo único que lee el enrutador.'
          examples:
            - authority.oic-iffe
        sealed:
          description: Sobre HPKE hacia la llave del nodo de esa autoridad, con texto en claro rellenado a un tramo fijo.
          $ref: '#/components/schemas/HpkeEnvelope'
      required:
        - v
        - to
        - sealed
      additionalProperties: false
      description: 'Sobre de red: el enrutador solo ve el destino y el tramo de tamaño.'
    RelayResponse:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        sealed:
          description: Respuesta del nodo cifrada hacia la llave efímera del navegador; si no se pudo entregar, relleno indistinguible del mismo tamaño.
          $ref: '#/components/schemas/HpkeEnvelope'
      required:
        - v
        - sealed
      additionalProperties: false
      description: 'Respuesta del enrutador: igual en estatus, cabeceras y tamaño sin importar el destino ni el resultado.'
    RoutedRequest:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        to:
          type: string
          pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Autoridad destino; debe coincidir con la del encabezado externo.
          examples:
            - authority.oic-iffe
        operationId:
          type: string
          enum:
            - getPowChallenge
            - uploadEvidence
            - submitComplaint
            - getTracking
            - sendReporterMessage
            - fileAppeal
          description: Operación del Estándar S5 que se pide al nodo.
        query:
          type: object
          propertyNames:
            type: string
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 256
          description: Parámetros de consulta de la operación.
        proofOfWork:
          anyOf:
            - type: string
              maxLength: 512
            - type: 'null'
          description: Valor de la cabecera de prueba de trabajo, o null.
        body:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  const: none
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: json
                value: {}
              required:
                - kind
                - value
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: binary
                mediaType:
                  type: string
                  minLength: 1
                  maxLength: 100
                data:
                  type: string
                  pattern: ^[A-Za-z0-9_-]*$
              required:
                - kind
                - mediaType
                - data
              additionalProperties: false
          description: 'Cuerpo: none (sin cuerpo), json (valor JSON) o binary (tipo de medio y bytes en Base64URL).'
        replyPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Llave pública X25519 efímera hacia la que el nodo cifra la respuesta.
      required:
        - v
        - to
        - operationId
        - query
        - proofOfWork
        - body
        - replyPublicKey
      additionalProperties: false
      description: 'Contenido de un sobre de red, que solo abre el nodo: la operación pedida, su cuerpo, su prueba de trabajo y la llave efímera de respuesta.'
    RoutedReply:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Estatus HTTP que dio el nodo a la operación.
        body:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  const: none
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: json
                value: {}
              required:
                - kind
                - value
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  const: binary
                mediaType:
                  type: string
                  minLength: 1
                  maxLength: 100
                data:
                  type: string
                  pattern: ^[A-Za-z0-9_-]*$
              required:
                - kind
                - mediaType
                - data
              additionalProperties: false
          description: 'Cuerpo: none (sin cuerpo), json (valor JSON) o binary (tipo de medio y bytes en Base64URL).'
      required:
        - v
        - status
        - body
      additionalProperties: false
      description: Respuesta del nodo dentro del sobre de vuelta.
    NodeRegistration:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 'Número creciente: un registro anterior no puede reenviarse.'
        standardVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          description: Versión del Estándar S5 que implementa el nodo.
        acceptsRelay:
          type: boolean
          description: Si el nodo ya recibe sobres de red en su buzón de red.
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del nodo sobre "sigilo/red/node-registration/v1:" + forma canónica del registro sin este campo.
      required:
        - v
        - nodeId
        - sequence
        - standardVersion
        - acceptsRelay
        - signature
      additionalProperties: false
      description: Registro de un nodo ante el enrutador, firmado con su llave del directorio.
    NodeRegistrationReceipt:
      type: object
      properties:
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Secuencia aceptada.
        acceptsRelay:
          type: boolean
          description: Si el enrutador le entregará sobres.
        registeredOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día del registro (UTC).
          examples:
            - '2026-11-05'
      required:
        - nodeId
        - sequence
        - acceptsRelay
        - registeredOn
      additionalProperties: false
      description: Acuse del registro.
    NodeHeadAcceptance:
      type: object
      properties:
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        status:
          type: string
          enum:
            - recorded
            - unchanged
          description: 'recorded: se agregó a la bitácora nacional; unchanged: ya estaba.'
        entrySeq:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Entrada de la bitácora nacional que contiene la cabeza.
      required:
        - nodeId
        - status
        - entrySeq
      additionalProperties: false
      description: Resultado de publicar la cabeza de un nodo.
    NationalLedgerEntry:
      oneOf:
        - type: object
          properties:
            v:
              type: number
              const: 1
            seq:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            type:
              type: string
              const: node.head
            at:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
              examples:
                - '2026-11-05'
            nodeId:
              type: string
              pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable del nodo.
              examples:
                - node.queretaro
            nodeHead:
              $ref: '#/components/schemas/SignedLedgerHead'
            prevHash:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
            hash:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
          required:
            - v
            - seq
            - type
            - at
            - nodeId
            - nodeHead
            - prevHash
            - hash
          additionalProperties: false
          description: Cabeza firmada de la bitácora de un nodo.
        - type: object
          properties:
            v:
              type: number
              const: 1
            seq:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            type:
              type: string
              const: directory.version
            at:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
              examples:
                - '2026-11-05'
            directorySerial:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            directoryDigest:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
            prevHash:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
            hash:
              type: string
              pattern: ^[0-9a-f]{64}$
              description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
          required:
            - v
            - seq
            - type
            - at
            - directorySerial
            - directoryDigest
            - prevHash
            - hash
          additionalProperties: false
          description: Versión publicada del directorio.
      description: 'Entrada de la bitácora nacional: `hash` es el SHA-256 de la forma canónica de la entrada sin ese campo y `prevHash` el de la anterior (64 ceros en la primera).'
    NationalHead:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        seq:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Última entrada cubierta.
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash de esa entrada.
        at:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día en que se emitió la cabeza.
          examples:
            - '2026-11-05'
        directorySerial:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Versión del directorio vigente al emitirla.
        operatorKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
      required:
        - v
        - seq
        - hash
        - at
        - directorySerial
        - operatorKeyId
      additionalProperties: false
      description: Cabeza de la bitácora nacional.
    CosignedNationalHead:
      type: object
      properties:
        head:
          $ref: '#/components/schemas/NationalHead'
        operatorSignature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 de la operación sobre "sigilo/red/national-head/operator/v1:" + forma canónica de head.
        cosignatures:
          type: array
          items:
            $ref: '#/components/schemas/WitnessSignature'
          description: Cofirmas sobre "sigilo/red/national-head/witness/v1:" + forma canónica de head. Vale con m de n.
      required:
        - head
        - operatorSignature
        - cosignatures
      additionalProperties: false
      description: Cabeza nacional con la firma de la operación y las cofirmas.
    NationalCosignatureRequest:
      type: object
      properties:
        seq:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Secuencia de la cabeza cofirmada.
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Hash de la cabeza cofirmada.
        cosignature:
          $ref: '#/components/schemas/WitnessSignature'
      required:
        - seq
        - hash
        - cosignature
      additionalProperties: false
      description: Cofirma de un testigo sobre una cabeza nacional pendiente.
    NationalLedgerPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/NationalLedgerEntry'
          description: Entradas en orden.
        head:
          anyOf:
            - $ref: '#/components/schemas/CosignedNationalHead'
            - type: 'null'
          description: Última cabeza con m cofirmas, o null si todavía no hay.
      required:
        - entries
        - head
      additionalProperties: false
      description: Página de la bitácora nacional.
    NationalInclusionProof:
      type: object
      properties:
        entry:
          $ref: '#/components/schemas/NationalLedgerEntry'
        chain:
          type: array
          items:
            $ref: '#/components/schemas/NationalLedgerEntry'
          description: Tramo desde la entrada (incluida) hasta la de la cabeza, sin huecos.
        head:
          $ref: '#/components/schemas/CosignedNationalHead'
      required:
        - entry
        - chain
        - head
      additionalProperties: false
      description: 'Prueba de que la cabeza de un nodo está en la bitácora nacional: la entrada, el tramo hasta la cabeza y la cabeza cofirmada.'
    NationalOpenData:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        cutAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:00Z$
          description: Hora del corte (UTC).
          examples:
            - 2026-11-05T17:00Z
        closedBefore:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 'Mes en curso al hacer el corte: solo se aceptan meses anteriores (cerrados y congelados en cada nodo).'
          examples:
            - 2026-09
        directorySerial:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Versión del directorio con la que se eligieron los nodos.
        minCell:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Celda mínima, aplicada en cada nodo y otra vez después de sumar.
        rounding:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Múltiplo de los conteos publicados.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NationalOpenDataNode'
          description: Todos los nodos del directorio, sumados o no, en el orden del directorio.
        cells:
          type: array
          items:
            $ref: '#/components/schemas/NationalOpenDataCell'
          description: Celdas nacionales ordenadas por mes, entidad, conducta y estatus.
        suppressed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 'Suprimidas: la suma de la fila de suprimidas de cada nodo más las celdas que quedaron bajo la celda mínima después de sumar.'
      required:
        - v
        - cutAt
        - closedBefore
        - directorySerial
        - minCell
        - rounding
        - nodes
        - cells
        - suppressed
      additionalProperties: false
      description: 'Corte nacional de datos abiertos: suma por entidad, conducta, mes y estatus de los CSV públicos de los nodos. Solo números: ninguna denuncia, folio ni persona. No está firmado; cualquiera puede rehacerlo con los CSV de cada nodo.'
    NationalOpenDataNode:
      type: object
      properties:
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Nombre del nodo en el directorio.
        status:
          type: string
          enum:
            - included
            - unreachable
            - rejected
          description: 'included: su CSV se sumó; unreachable: no respondió (sin datos de ese nodo en este corte); rejected: su CSV no cumplió las reglas y no se sumó.'
        rejection:
          anyOf:
            - type: string
              enum:
                - too-large
                - header
                - row
                - open-month
                - rounding
                - min-cell
                - duplicate
                - suppressed-row
            - type: 'null'
          description: 'Regla que no cumplió el CSV: too-large, header, row, open-month (mes no cerrado), rounding, min-cell, duplicate o suppressed-row; null si no se rechazó.'
        cells:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Filas publicadas que aportó el nodo (0 si no se sumó).
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 'Denuncias que aportó el nodo: sus filas más su fila de suprimidas.'
        ledgerHead:
          anyOf:
            - $ref: '#/components/schemas/SignedLedgerHead'
            - type: 'null'
          description: Cabeza firmada de la bitácora del nodo vigente en la bitácora nacional al hacer el corte, como referencia de integridad; null si aún no hay. No prueba los conteos.
        nationalEntrySeq:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: 'null'
          description: Entrada de la bitácora nacional que contiene esa cabeza, o null.
      required:
        - nodeId
        - name
        - status
        - rejection
        - cells
        - total
        - ledgerHead
        - nationalEntrySeq
      additionalProperties: false
      description: Participación de un nodo en el corte nacional.
    NationalOpenDataCell:
      type: object
      properties:
        stateCode:
          type: string
          pattern: ^\d{2}$
          description: Clave INEGI de la entidad federativa (2 dígitos).
          examples:
            - '22'
          x-catalog: STATES
          enum:
            - '01'
            - '02'
            - '03'
            - '04'
            - '05'
            - '06'
            - '07'
            - '08'
            - '09'
            - '10'
            - '11'
