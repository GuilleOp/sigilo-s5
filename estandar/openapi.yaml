      summary: Prueba de inclusión de una cabeza de nodo
      description: Entrada que contiene exactamente esa cabeza del nodo, el tramo hasta la última cabeza cofirmada y esa cabeza. Responde `404` si la cabeza no está, o si todavía no la cubre una cabeza con m cofirmas.
