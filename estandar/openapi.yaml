  /api/v1/tracking:
    post:
      operationId: getTracking
      tags:
        - Seguimiento
      summary: Consultar el seguimiento
      description: La persona denunciante envía su folio y la llave derivada de su recibo (nunca el recibo). Si alguno es incorrecto, la respuesta es la misma `404 not_found`, sin decir cuál falló. Los fallos por folio están limitados.
