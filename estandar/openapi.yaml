      additionalProperties: false
      description: Lote de acuerdos recibidos por otros medios; queda en la bitácora como un solo evento con su digesto.
    ImportClosuresResponse:
      type: object
      properties:
        imported:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Acuerdos nuevos.
        skipped:
