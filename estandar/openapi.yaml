    get:
      operationId: listLedgerEvents
      tags:
        - Bitácora pública
      summary: Eventos de la bitácora
      description: Página de eventos desde `from` (secuencia) o desde `since` (día; la página empieza en el último evento anterior a ese día). `from` y `since` no se combinan.
      security: []
      parameters:
        - name: from
          in: query
          required: false
          description: Secuencia inicial; 0 por omisión.
          schema:
            type: integer
            minimum: 0
            maximum: 999999999999999
        - name: since
          in: query
          required: false
          description: Día inicial (AAAA-MM-DD); no se combina con `from`.
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: limit
          in: query
          required: false
          description: 'Tamaño de página: 100 por omisión y 500 como máximo.'
          schema:
