        - request
      additionalProperties: false
      description: Comprobante del nodo destino de un turnado entre nodos, con la denuncia que recibió para ligarlo a la denuncia turnada.
    ImportClosuresRequest:
      type: object
      properties:
        acts:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            type: object
            properties:
              fileNumber:
                type: string
                minLength: 1
                maxLength: 64
                description: Expediente del acuerdo.
              issuedOn:
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
                description: Día del acuerdo.
                examples:
                  - '2026-11-05'
              reason:
                $ref: '#/components/schemas/ClosureReason'
              qualification:
