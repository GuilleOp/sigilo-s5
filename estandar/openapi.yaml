  /api/v1/red/national/open-data:
    servers:
      - url: http://127.0.0.1:8790
        description: Enrutador en local (`npm run dev:enrutador` o `docker compose up`).
      - url: https://red.example.org
        description: Ejemplo de un enrutador publicado (dominio reservado para ejemplos).
    get:
      operationId: getNationalOpenData
      tags:
        - Red
      summary: Corte nacional de datos abiertos
      description: 'Suma por entidad, conducta, mes y estatus de los CSV públicos de datos abiertos de cada nodo del directorio (Bases de la PDN, arts. 60 y 61). El enrutador descarga cada CSV en `GET /api/v1/open-data/complaints.csv`, lo valida (encabezado, catálogos, solo meses anteriores al mes en curso, conteos múltiplos de 5 y de al menos 5, sin celdas repetidas y con su fila de suprimidas) y descarta completo el que no cumpla. Después de sumar vuelve a aplicar la celda mínima. Un nodo que no responde aparece como `unreachable`: sin datos de ese nodo en este corte. Cada nodo lleva la cabeza de su bitácora vigente en la bitácora nacional, como referencia; los conteos no están firmados ni se pueden comprobar con ella: se comprueban rehaciendo la suma con los CSV de los nodos. Responde `404` hasta el primer corte.'
      security: []
      responses:
        '200':
          description: Último corte nacional.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalOpenData'
