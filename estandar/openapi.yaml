                          confirmation: confirmed
                          isRevealed: true
                          groupId: 4b8e1f0a2c9d7e3651a0b4c8d2e6f193
                          complaints: 2
                          independentSources: 2
                          confirmedOtherSources: 1
                          sameOriginCount: 1
                          flags: []
                          signals: []
        '400':
          description: '`bad_request`: La solicitud no cumple el esquema o sus parámetros no son válidos.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: bad_request
                  message: La solicitud no es válida.
        '401':
          description: '`unauthorized`: Falta la sesión de la autoridad, venció o no es válida, o el usuario y la contraseña no coinciden (sin decir cuál).'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
