            pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
        - name: seq
          in: query
          required: true
          description: Secuencia de la cabeza del nodo.
          schema:
            type: integer
            minimum: 0
            maximum: 999999999999999
        - name: hash
          in: query
          required: true
          description: Hash de la cabeza del nodo.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
