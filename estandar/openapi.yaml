    post:
      operationId: transferComplaint
      tags:
        - Autoridad
      summary: Turnar a otro nodo
      description: Turna la denuncia a una autoridad de otro nodo de la red (SEC-19). El navegador de la autoridad descifra la denuncia y la vuelve a cifrar hacia la autoridad destino en un sobre del enrutador ciego; el nodo solo lo transporta al enrutador, registra `complaint.transferred` con el digesto del sobre y el seudónimo de la cuenta, y devuelve la respuesta cifrada, que solo abre ese navegador. Solo recepción y turnado de la autoridad que la tiene. Responde `400` si el destino no es una autoridad de otro nodo del directorio o el sobre no va hacia ella, y `409` si el nodo no está en una red con enrutador o la denuncia ya se cerró.
