        legalOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día civil en la hora del centro de México (America/Mexico_City) con el que se cuentan los plazos legales; puede diferir del día UTC.
          examples:
            - '2026-11-05'
        reason:
          $ref: '#/components/schemas/ClosureReason'
        reasonName:
          type: string
