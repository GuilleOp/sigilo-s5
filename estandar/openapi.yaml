openapi: 3.1.0
info:
  title: Estándar S5
  summary: API del sistema de denuncias con anonimato verificable.
  description: |-
    Especificación abierta del Sistema de denuncias públicas de faltas administrativas y hechos de corrupción (S5) de la Plataforma Digital Nacional, propuesta por SIGILO. Prototipo para el Datatón Anticorrupción 2026; no es el sistema oficial.

    La identidad de la persona denunciante se cifra en su navegador hacia la llave de la autoridad (HPKE, RFC 9180) y el servidor nunca la ve. El seguimiento usa un folio aleatorio y una llave derivada de un recibo de 8 palabras. Toda acción de la autoridad queda en una bitácora pública encadenada y firmada.

    El grupo «Red» describe la red federada: el directorio de autoridades firmado y cofirmado por testigos, el enrutador ciego (que solo ve el destino), el registro de nodos y la bitácora nacional cofirmada m de n. Lo sirve el enrutador, salvo el buzón de red, que lo sirve cada nodo.

    El grupo «Corroboración» describe la corroboración ciega con VOPRF (RFC 9497): el evaluador OPRF, que ve solo elementos cegados, y el índice de coincidencias, que ve solo etiquetas y cuenta fuentes independientes. Son dos servicios con operación separada.

    Documento generado desde `packages/contracts` con `npm run standard:build`. Los esquemas son JSON Schema 2020-12. Las peticiones y respuestas no admiten campos que no estén en su esquema. El diccionario de datos y los ejemplos están en la misma carpeta.
  version: 0.2.0
  license:
    name: CC BY-NC 4.0
    identifier: CC-BY-NC-4.0
servers:
  - url: http://127.0.0.1:8787
    description: Servidor de referencia en local (`npm run dev:server`).
  - url: https://denuncias.example.org
    description: Ejemplo de un nodo publicado (dominio reservado para ejemplos).
tags:
  - name: Denuncia
    description: Recepción de denuncias y de sus pruebas, con prueba de trabajo y sin cuentas.
  - name: Seguimiento
    description: Consulta y buzón de la persona denunciante con su folio y la llave derivada de su recibo.
  - name: Sesión de la autoridad
    description: Inicio y cierre de sesión con cuentas individuales; la sesión vence por inactividad y por duración.
  - name: Autoridad
    description: Panel de la autoridad competente con la sesión de una cuenta individual. Cada ruta comprueba la función de la cuenta y la competencia por folio, y toda acción deja rastro con el seudónimo de la cuenta.
  - name: Bitácora pública
    description: Registro de solo agregar, encadenado y firmado, que cualquiera puede verificar.
  - name: Datos abiertos
    description: Conteos agregados con redondeo y supresión.
  - name: Alta de autoridades
    description: Solicitud pública de alta de una institución con su candado (solo llaves públicas) y bandeja de la cuenta de operación del nodo, que aprueba con la huella confirmada por teléfono o rechaza con motivo.
  - name: Llaves y retos
    description: Llaves públicas del despliegue y retos de prueba de trabajo.
  - name: Red
    description: 'Red federada «un S5, muchas llaves»: directorio de autoridades firmado y cofirmado por testigos, enrutador ciego que solo ve el destino, registro de nodos y bitácora nacional cofirmada m de n. Las sirve el enrutador, salvo el buzón de red, que lo sirve cada nodo.'
  - name: Corroboración
    description: 'Corroboración ciega con VOPRF (RFC 9497, ristretto255-SHA512): el navegador obtiene del evaluador OPRF una etiqueta del identificador sin revelarlo, y el índice de coincidencias cuenta fuentes independientes por etiqueta sin saber a quién se acusa. Son dos servicios que operan partes distintas; la coincidencia solo suma prioridad explicable.'
paths:
  /api/v1/keys:
    get:
      operationId: getPublicKeys
      tags:
        - Llaves y retos
      summary: Llaves públicas del despliegue
      description: Devuelve la llave de firma del servidor y las llaves de cifrado y firma de la autoridad. El cliente debe compararlas con las que trae fijadas antes de cifrar nada.
      security: []
      responses:
        '200':
          description: Llaves públicas vigentes.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeySet'
              examples:
                sintetico:
                  summary: Ejemplo sintético
                  description: También en `ejemplos/get-public-keys.response.json`.
                  value:
                    server:
                      keyId: c64189c912bb3ce1
                      signingPublicKey: koU17lKEjuOFp0wedjlrUX_6_zjY4J6NAqum-6bZbV4
                    authority:
                      keyId: f7bc219ff223a248
                      boxPublicKey: 59DzqAXh0GayVcyOxLXOPdmS40vlacHXPTju6YOEksA
                      signingPublicKey: LwOm2CURiB03_1by-45eeVVwt3X8LbWBghACfl8oU-I
        '500':
          description: '`internal`: Error interno, sin detalles.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: internal
                  message: Error interno del servidor.
  /api/v1/pow/challenge:
    get:
      operationId: getPowChallenge
      tags:
        - Llaves y retos
      summary: Reto de prueba de trabajo
      description: Entrega un reto firmado y con vencimiento. Un reto `complaint` sirve para las hasta 10 subidas de pruebas de una denuncia y para su envío; uno `message`, para un mensaje. La dificultad sube con la carga.
      security: []
      parameters:
        - name: purpose
          in: query
          required: true
          description: Propósito del reto.
          schema:
            type: string
            enum:
              - complaint
              - message
              - registration
      responses:
        '200':
          description: Reto vigente.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowChallenge'
              examples:
                sintetico:
                  summary: Ejemplo sintético
                  description: También en `ejemplos/get-pow-challenge.response.json`.
                  value:
                    token: tpHur4SEBFgkV0Qx7zs7yaRNuCt0gk6E.uAXrUKi4UunPlnHDlkK-3uZkD6JBeKuENnTwWJiCIgs
                    bits: 18
        '400':
          description: '`bad_request`: La solicitud no cumple el esquema o sus parámetros no son válidos.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: bad_request
                  message: La solicitud no es válida.
        '500':
          description: '`internal`: Error interno, sin detalles.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: internal
                  message: Error interno del servidor.
  /api/v1/evidence:
    post:
      operationId: uploadEvidence
      tags:
        - Denuncia
      summary: Subir una prueba
      description: Recibe una imagen ya limpia en el navegador (sin metadatos; los PDF llegan convertidos a imagen) como cuerpo binario. Usa el reto `complaint` de la denuncia. La prueba queda pendiente hasta que se envía la denuncia que la cita.
      security:
        - proofOfWork: []
      requestBody:
        required: true
        description: Cuerpo de la petición. Bytes de la imagen limpia, de hasta 10 MiB.
        content:
          image/jpeg: {}
          image/png: {}
      responses:
        '201':
          description: Prueba guardada.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDescriptor'
              examples:
                sintetico:
                  summary: Ejemplo sintético
                  description: También en `ejemplos/upload-evidence.response.json`.
                  value:
                    evidenceId: 16ed88d6f3ea7c6c4841645c43cd2c79
                    mediaType: image/jpeg
                    sha256: 2fba3e8225db3948a2560e78ff0f3c161472b03d83f6505ee3b124ecc19405ed
                    sizeBytes: 482113
        '400':
          description: '`bad_request`: La solicitud no cumple el esquema o sus parámetros no son válidos.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: bad_request
                  message: La solicitud no es válida.
        '413':
          description: '`payload_too_large`: El cuerpo excede el tamaño permitido o la cuota de pruebas de la denuncia.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: payload_too_large
                  message: El contenido excede el tamaño permitido.
        '415':
          description: '`unsupported_media_type`: El tipo de contenido no es el que admite la ruta.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: unsupported_media_type
                  message: Tipo de contenido no admitido.
        '428':
          description: '`proof_required`: Falta la prueba de trabajo, no es válida, venció o ya se usó.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: proof_required
                  message: Falta una prueba de trabajo válida y vigente.
        '500':
          description: '`internal`: Error interno, sin detalles.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: internal
                  message: Error interno del servidor.
        '507':
          description: '`storage_full`: Se alcanzó la cuota total de almacenamiento de pruebas.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: storage_full
                  message: No hay espacio para más pruebas por ahora. Intenta más tarde.
  /api/v1/complaints:
    post:
      operationId: submitComplaint
      tags:
        - Denuncia
      summary: Enviar una denuncia
      description: Recibe los hechos legibles y, en modo `sealed`, la identidad cifrada hacia la autoridad; con `escalationEnvelope`, la segunda llave hacia la supervisora (solo hechos y pruebas). Rechaza campos desconocidos y caracteres invisibles en el texto libre. No pide cuenta ni datos de contacto. Responde con el folio y un comprobante firmado; el evento `complaint.received` se publica en la bitácora al cerrar el día.
      security:
        - proofOfWork: []
      requestBody:
        required: true
        description: Cuerpo de la petición.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitComplaintRequest'
            examples:
