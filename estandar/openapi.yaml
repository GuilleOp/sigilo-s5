            severityName:
              type: string
              description: Falta grave o falta no grave.
            explanation:
              type: string
              description: Qué significa y qué puede hacer quien denunció.
            legalBasis:
              type: string
              minLength: 20
              maxLength: 1000
              description: Fundamento legal y motivo; la persona denunciante lo ve.
            agreement:
              type: string
              minLength: 50
              maxLength: 20000
              description: Versión pública del acuerdo de cierre, sin datos personales. Queda disponible para el auditor y para la persona denunciante.
            appealDueOn:
              description: 'Último día para inconformarse: 5 días hábiles desde la notificación (LGRA, art. 103).'
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              examples:
                - '2026-11-05'
            appeal:
              type: object
              properties:
                filedOn:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
                  examples:
                    - '2026-11-05'
                legalOn:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Día civil en la hora del centro de México (America/Mexico_City) con el que se cuentan los plazos legales; puede diferir del día UTC.
                  examples:
                    - '2026-11-05'
                reasons:
                  type: string
                  description: Motivos por los que estima indebida la calificación.
                resolutionDueOn:
                  description: 'Plazo de la Sala para resolver: 30 días hábiles (LGRA, art. 107).'
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  examples:
                    - '2026-11-05'
              required:
                - filedOn
                - legalOn
                - reasons
              additionalProperties: false
              description: Recurso de inconformidad presentado contra la calificación.
          required:
