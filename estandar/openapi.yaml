  /api/v1/authority/complaints/{folio}/procedure:
    post:
      operationId: applyProcedureAction
      tags:
        - Autoridad
      summary: Acción del trámite
      description: Turnar (`route`, solo recepción y turnado del buzón general), aceptar, reasignar o devolver al buzón general (recepción y turnado de la autoridad que la tiene), avanzar de etapa legal (investigación) o cerrar con uno de los seis motivos, su fundamento y la versión pública del acuerdo. Cada acción registra `complaint.status_changed` con el seudónimo de la cuenta y, si lleva nota, la persona denunciante la lee en su seguimiento. Responde `403` si la función no puede, `404` si la denuncia es de otra autoridad y `409` si el flujo no admite la acción (`conflict`) o si la denuncia ya se reasignó 3 veces, el tope del S5 (`reassignment_limit`). Turnar exige el motivo (`note`, al menos 10 caracteres).
      security:
        - authorityBearer: []
      parameters:
        - name: folio
          in: path
          required: true
          description: Folio de la denuncia.
          schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$
      requestBody:
        required: true
        description: Cuerpo de la petición.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureActionRequest'
            examples:
              sintetico:
                summary: Ejemplo sintético
                description: También en `ejemplos/apply-procedure-action.request.json`.
                value:
                  action: close
                  reason: attended
                  legalBasis: 'LGRA, art. 100: conclusión de la investigación con elementos.'
                  agreement: 'Con fundamento en el artículo 100 de la Ley General de Responsabilidades Administrativas se concluye la investigación del expediente sintético OIC-PRUEBA-0001: se requirió información a la unidad compradora y se comprobó la entrega completa de los bienes.'
      responses:
        '200':
          description: Estado del trámite después de la acción.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureState'
              examples:
                sintetico:
                  summary: Ejemplo sintético
                  description: También en `ejemplos/apply-procedure-action.response.json`.
                  value:
                    folio: K7Q2-M9XP-4RTD
                    status: resolved
                    managementState: closed
                    legalStage: investigation
                    closureReason: attended
                    assignedAuthorityId: authority.oic-iffe
        '400':
          description: '`bad_request`: La solicitud no cumple el esquema o sus parámetros no son válidos.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: bad_request
                  message: La solicitud no es válida.
        '401':
          description: '`unauthorized`: Falta la sesión de la autoridad, venció o no es válida, o el usuario y la contraseña no coinciden (sin decir cuál).'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
            WWW-Authenticate:
              description: Siempre `Bearer`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: unauthorized
                  message: No autorizado.
        '403':
          description: '`forbidden`: La función de la cuenta no permite la acción (separación de funciones); se responde antes de buscar el folio.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: forbidden
                  message: Tu función no permite esta acción.
        '404':
          description: '`not_found`: No existe el recurso, o el folio o el recibo no son correctos (sin decir cuál de los dos).'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: not_found
                  message: No encontrado.
        '409':
          description: |-
            `conflict`: La acción no corresponde al estado del trámite, a la etapa o a la solicitud (por ejemplo, aprobar dos veces).

            `reassignment_limit`: La denuncia ya se reasignó el máximo de veces (3, como en el S5): la autoridad puede devolverla al buzón general o la supervisión la revisa.
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                conflict:
                  value:
                    error:
                      code: conflict
                      message: La acción no corresponde al estado actual del trámite.
                reassignment_limit:
                  value:
                    error:
                      code: reassignment_limit
                      message: La denuncia ya se reasignó 3 veces, el máximo. Devuélvela al buzón general para que se turne de nuevo.
        '413':
          description: '`payload_too_large`: El cuerpo excede el tamaño permitido o la cuota de pruebas de la denuncia.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: payload_too_large
                  message: El contenido excede el tamaño permitido.
        '415':
          description: '`unsupported_media_type`: El tipo de contenido no es el que admite la ruta.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: unsupported_media_type
                  message: Tipo de contenido no admitido.
        '500':
          description: '`internal`: Error interno, sin detalles.'
          headers:
            Cache-Control:
              description: 'Siempre `no-store`: ninguna respuesta se guarda en cachés.'
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: internal
                  message: Error interno del servidor.
