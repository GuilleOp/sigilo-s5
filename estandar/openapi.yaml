        description: Índice de coincidencias en local (`npm run dev:indice`).
      - url: https://indice.example.org
        description: Ejemplo de un índice publicado (dominio reservado para ejemplos).
    post:
      operationId: listCorroborationNotices
      tags:
        - Corroboración
      summary: Avisos de corroboración para un nodo
      description: 'Petición firmada por el nodo. Devuelve los cambios de estado de los grupos donde el nodo tiene denuncias (por ejemplo, una coincidencia nueva con una denuncia archivada: posible nuevo indicio, LGRA, art. 100). Nunca dice qué otros nodos ni qué folios forman el grupo.'
      security: []
      requestBody:
        required: true
        description: Cuerpo de la petición.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexNoticesRequest'
            examples:
              sintetico:
                summary: Ejemplo sintético
                description: También en `ejemplos/list-corroboration-notices.request.json`.
                value:
                  v: 1
                  nodeId: node.federal
                  after: 0
                  requestedAt: 2026-11-12T16:30Z
                  signature: 7XdDyy1y5I9NAnkJ3hfkF7WFG8Z-o-EFmjpe-32pN3oxmSg9vQ-yk29HmYt-zMLCE7ZjhW8EgUD3kdP-FtonOg
      responses:
        '200':
          description: Avisos pendientes.
          headers:
            Cache-Control:
