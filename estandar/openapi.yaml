    IdentityOpeningRequestView:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Identificador aleatorio de una apertura de identidad (16 bytes en hexadecimal).
        requestedOn:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Fecha redondeada al día, en UTC (AAAA-MM-DD).
          examples:
            - '2026-11-05'
        legalBasis:
          type: string
          minLength: 20
          maxLength: 1000
          description: Fundamento legal y motivo; la persona denunciante lo ve.
        status:
          type: string
          enum:
            - pending
            - approved
            - expired
          description: pending (espera otra aprobación), approved (se abrió y la persona lo ve) o expired (venció sin el umbral).
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/IdentityApproval'
          description: Aprobaciones de personas distintas, incluida la de quien solicitó.
        threshold:
