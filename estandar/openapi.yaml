                    description: Clave estable del factor (config/prioridad.json).
                  label:
                    type: string
                    description: Nombre del factor.
                  points:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: Puntos que suma (0 si solo informa).
                  reason:
                    type: string
                    description: Por qué se aplicó.
                  source:
                    description: Fuente del dato, o null si viene de la denuncia o de fuera.
                    type:
                      - string
                      - 'null'
                required:
                  - id
                  - label
                  - points
                  - reason
                  - source
                additionalProperties: false
                description: Factor de la prioridad explicable.
              description: Factores aplicados.
            facts:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                    description: Qué dato es.
                  value:
                    type: string
                    description: El dato.
                  source:
                    type: string
                    description: Cita de la fuente y su fecha.
                required:
                  - label
                  - value
                  - source
                additionalProperties: false
                description: Dato público con su fuente.
              description: Datos públicos relevantes.
            notices:
              type: array
              items:
                type: string
              description: Alertas que no cambian la prioridad (conflicto, inconsistencias).
          required:
            - score
            - level
            - label
            - configVersion
            - factors
            - facts
            - notices
          additionalProperties: false
          description: 'Ficha de contexto con prioridad explicable: cada factor dice por qué se aplicó y de qué fuente viene. Orienta, nunca decide.'
        conflictReview:
          type: object
          properties:
            checkedOn:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Día de la revisión.
              examples:
                - '2026-11-05'
            authorityId:
              type: string
              description: Autoridad revisada (la que recibe el turno).
            outcome:
              type: string
              enum:
                - possible-conflict
                - none-found
                - no_coverage
              description: 'possible-conflict, none-found (no descarta un conflicto) o no_coverage (sin datos: nunca «sin conflicto»).'
            summary:
              type: string
              description: Resumen en español con el fundamento.
            alerts:
              type: array
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - conflict.shared-interest
                      - conflict.chain-of-command
                    description: Intereses declarados en común (S1) o cadena de mando (S2).
                  title:
                    type: string
                    description: Título de la alerta.
                  explanation:
                    type: string
                    description: Explicación con la fuente.
                  evidence:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          description: Qué dato es.
                        value:
                          type: string
                          description: El dato.
                        source:
                          type: string
                          description: Cita de la fuente y su fecha.
                      required:
                        - label
                        - value
                        - source
                      additionalProperties: false
                      description: Dato público con su fuente.
                    description: Evidencia (nombres, no porcentajes).
                required:
                  - kind
                  - title
                  - explanation
                  - evidence
                additionalProperties: false
                description: Alerta de posible conflicto de interés.
              description: Alertas con su evidencia.
            requiresResponse:
              type: boolean
              description: Si la autoridad debe excusarse o justificar antes de resolver.
            response:
              description: Respuesta registrada de la autoridad, si ya la hay.
              type: string
              enum:
                - excuse
                - justification
          required:
            - checkedOn
            - authorityId
            - outcome
            - summary
            - alerts
            - requiresResponse
          additionalProperties: false
          description: Revisión de conflicto de interés antes de turnar.
        corroboration:
          type: object
          properties:
            sources:
              type: string
              enum:
                - one
                - two_or_more
              description: 'Personas independientes que denuncian lo mismo, en intervalos: one (solo esta) o two_or_more (2 o más). Nunca el conteo exacto, para que el detalle no sirva de oráculo.'
            isPossibleCampaign:
              type: boolean
              description: 'Posible campaña: el grupo cuenta como una fuente.'
            updatedOn:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Día del último aviso del índice.
              examples:
                - '2026-11-05'
            newIndicationOn:
              description: 'Si la denuncia estaba archivada cuando llegó otra corroboración: posible nuevo indicio (LGRA, art. 100).'
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              examples:
                - '2026-11-05'
          required:
            - sources
            - isPossibleCampaign
            - updatedOn
          additionalProperties: false
          description: 'Corroboración ciega: cuántas fuentes independientes coinciden.'
        auditSignals:
          description: Señales del auditor sobre los acuerdos y el caso.
          type: array
          items:
            type: object
            properties:
              ruleId:
                type: string
                enum:
                  - AUD-01
                  - AUD-02
                  - AUD-03
                  - AUD-04
                  - AUD-05
                  - AUD-06
                  - AUD-07
                  - AUD-08
                  - AUD-M1
                  - AUD-M2
                description: 'Regla del auditor: AUD-01 a AUD-08 son reglas deterministas; AUD-M1 y AUD-M2, tareas orientativas del modelo local.'
              key:
                type: string
                description: Clave estable de la señal.
              name:
                type: string
                description: Nombre de la señal.
              explanation:
                type: string
                description: Por qué se señaló.
              'on':
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
                description: Día de la evaluación.
                examples:
                  - '2026-11-05'
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: Qué se compara.
                    actText:
                      description: Lo que dice el acuerdo.
                      type:
                        - string
                        - 'null'
                    counterpart:
                      type: string
                      description: La prueba o el dato que lo contrasta.
                    counterpartSource:
                      type: string
                      description: De dónde sale el contraste.
                  required:
                    - label
                    - actText
                    - counterpart
                    - counterpartSource
                  additionalProperties: false
                description: Evidencia lado a lado.
              note:
                type: string
                description: 'Recordatorio: la señal no decide nada.'
            required:
              - ruleId
              - key
              - name
              - explanation
              - 'on'
              - evidence
              - note
            additionalProperties: false
            description: Señal del auditor sobre un acuerdo o un caso. No decide nada.
      required:
        - summary
        - version
        - facts
        - evidence
        - reporterKeys
        - authVerifier
        - messages
        - identityOpenedCount
      additionalProperties: false
      description: Detalle para la autoridad, con todo lo necesario para recalcular el contexto del sobre de identidad. La identidad no viene aquí.
    ProcedureActionRequest:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              const: route
            authorityId:
              type: string
              pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable de la autoridad.
              examples:
                - authority.oic-iffe
            note:
              type: string
              minLength: 10
              maxLength: 2000
              description: 'Motivo del turno (al menos 10 caracteres sin contar espacios al inicio ni al final): por qué la denuncia va a esa autoridad. La persona denunciante lo lee tal cual.'
          required:
            - action
            - authorityId
            - note
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: accept
            note:
              type: string
              minLength: 1
              maxLength: 2000
              description: Nota pública de la autoridad; la persona denunciante la lee tal cual.
          required:
            - action
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: reassign
            authorityId:
              type: string
              pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
              description: Identificador estable de la autoridad.
              examples:
                - authority.oic-iffe
            note:
              type: string
              minLength: 1
              maxLength: 2000
              description: Nota pública de la autoridad; la persona denunciante la lee tal cual.
          required:
            - action
            - authorityId
            - note
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: return
            note:
              type: string
              minLength: 1
              maxLength: 2000
              description: Nota pública de la autoridad; la persona denunciante la lee tal cual.
          required:
            - action
            - note
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: advance_stage
            stage:
              $ref: '#/components/schemas/LegalStage'
            note:
              type: string
              minLength: 1
              maxLength: 2000
              description: Nota pública de la autoridad; la persona denunciante la lee tal cual.
            qualification:
              type: object
              properties:
                severity:
                  type: string
                  enum:
                    - serious
                    - non_serious
                  description: 'Calificación de la falta: serious (grave) o non_serious (no grave).'
                legalBasis:
                  type: string
                  minLength: 20
                  maxLength: 1000
                  description: Fundamento legal y motivo; la persona denunciante lo ve.
                agreement:
                  type: string
                  minLength: 50
                  maxLength: 20000
                  description: Versión pública del acuerdo de cierre, sin datos personales. Queda disponible para el auditor y para la persona denunciante.
              required:
                - severity
                - legalBasis
                - agreement
              additionalProperties: false
              description: Calificación de la falta como grave o no grave, con fundamento y acuerdo en versión pública. Si es no grave, se notifica a quien denunció y puede inconformarse (LGRA, arts. 102 y 103).
          required:
            - action
            - stage
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: close
            reason:
              $ref: '#/components/schemas/ClosureReason'
            legalBasis:
              type: string
              minLength: 20
              maxLength: 1000
              description: Fundamento legal y motivo; la persona denunciante lo ve.
            agreement:
              type: string
              minLength: 50
              maxLength: 20000
              description: Versión pública del acuerdo de cierre, sin datos personales. Queda disponible para el auditor y para la persona denunciante.
            sanction:
              type: object
              properties:
                fileNumber:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Expediente de la resolución.
                personName:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Persona sancionada (ya pública en S3 si se publicó).
                sanction:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Sanción en texto libre.
                institution:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: Institución de la persona.
                stateCode:
                  type: string
                  minLength: 2
                  maxLength: 16
                  description: Clave INEGI de la entidad o 00 para lo federal.
              required:
                - fileNumber
                - personName
                - sanction
                - institution
                - stateCode
              additionalProperties: false
              description: Sanción declarada en el cierre, para verificarla contra S3.
          required:
            - action
            - reason
            - legalBasis
            - agreement
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: respond_conflict
            response:
              type: string
              enum:
                - excuse
                - justification
              description: 'excuse: la autoridad se excusa (LGRA, art. 58); justification: explica por qué no hay conflicto.'
            note:
              type: string
              minLength: 1
              maxLength: 2000
              description: Nota pública de la autoridad; la persona denunciante la lee tal cual.
          required:
            - action
            - response
            - note
          additionalProperties: false
      description: 'Acción del trámite: route (con su motivo obligatorio), accept, reassign, return, advance_stage, close (con sanción opcional, que se verifica contra S3) o respond_conflict (excusa o justificación ante un posible conflicto). Cada una queda en la bitácora y, si lleva nota, en el seguimiento.'
    ProcedureState:
      type: object
