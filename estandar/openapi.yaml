          description: 'Folio público aleatorio de la denuncia: 12 caracteres Base32 de Crockford (60 bits) en tres grupos de 4. No es secuencial.'
          examples:
            - K7Q2-M9XP-4RTD
        authorityId:
          type: string
          pattern: ^authority\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable de la autoridad.
