        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: Mes de recepción (AAAA-MM), ya cerrado.
          examples:
            - 2026-09
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        count:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 'Suma de los conteos publicados por los nodos (ya redondeados): múltiplo del redondeo y al menos la celda mínima.'
      required:
        - stateCode
        - offenseCode
        - month
        - status
        - count
      additionalProperties: false
      description: 'Celda del corte nacional: entidad, conducta, mes y estatus.'
    CorroborationEvaluatorKey:
      type: object
      properties:
        suite:
          type: string
          const: ristretto255-SHA512/VOPRF
          description: 'Suite OPRF de RFC 9497: ristretto255-SHA512, modo VOPRF (0x01).'
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Época de la llave. Cambia solo al rotarla por compromiso; las etiquetas de épocas distintas no coinciden.
        keyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: Primeros 16 hexadecimales del SHA-256 de la llave pública OPRF.
          examples:
            - 3f9a1c0b7d2e4a68
        publicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Llave pública OPRF (elemento ristretto255 de 32 bytes): contra ella el navegador verifica la prueba DLEQ.'
        signingKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        signingPublicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Llave Ed25519 con la que el evaluador firma su conteo diario de evaluaciones.
        validFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Primer día de vigencia de la época.
          examples:
            - '2026-11-05'
      required:
        - suite
        - epoch
        - keyId
        - publicKey
        - signingKeyId
        - signingPublicKey
        - validFrom
      additionalProperties: false
      description: Llave pública del evaluador OPRF de la corroboración ciega.
    DirectoryCorroboration:
      type: object
      properties:
        evaluator:
          $ref: '#/components/schemas/CorroborationEvaluatorKey'
        evaluatorUrl:
          type: string
          pattern: ^https?:\/\/[^\s/?#]+$
          description: Origen público del evaluador OPRF.
        indexUrl:
          type: string
          pattern: ^https?:\/\/[^\s/?#]+$
          description: Origen del índice de coincidencias (solo lo llaman los nodos).
      required:
        - evaluator
        - evaluatorUrl
        - indexUrl
      additionalProperties: false
      description: 'Servicios de la corroboración ciega: evaluador OPRF e índice de coincidencias, operados por partes distintas (ADR 0006).'
    CorroborationIdentifierKind:
      type: string
      enum:
        - servidor
        - rfc
        - ocid
      description: 'Tipo de identificador: servidor (nombre de la persona servidora pública y clave del ente), rfc (RFC de un proveedor) u ocid (procedimiento de contratación OCDS).'
    CorroborationEvaluationRequest:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        keyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: Llave del evaluador con la que el navegador espera la evaluación.
          examples:
            - 3f9a1c0b7d2e4a68
        blinded:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Elemento cegado (ristretto255, 32 bytes): el evaluador no puede saber de qué identificador viene.'
      required:
        - v
        - keyId
        - blinded
      additionalProperties: false
      description: Petición de evaluación OPRF. No lleva identificador, etiqueta, folio ni nada de la denuncia.
    CorroborationEvaluationResponse:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        suite:
          type: string
          const: ristretto255-SHA512/VOPRF
          description: Suite OPRF con la que se evaluó.
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Época de la llave que evaluó.
        keyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        evaluated:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]+$
          description: Elemento evaluado con la llave privada del evaluador.
        proof:
          type: string
          minLength: 86
          maxLength: 86
          pattern: ^[A-Za-z0-9_-]+$
          description: Prueba DLEQ (RFC 9497, sección 2.2) de que se usó la llave publicada; el navegador la verifica antes de usar el resultado.
      required:
        - v
        - suite
        - epoch
        - keyId
        - evaluated
        - proof
      additionalProperties: false
      description: Resultado de la evaluación con su prueba de llave única.
    EvaluationDailyCount:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        day:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Día ya cerrado (UTC) al que corresponde el conteo.
          examples:
            - '2026-11-05'
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Época de la llave del evaluador.
        evaluations:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Evaluaciones que hizo el evaluador ese día.
        signingKeyId:
          type: string
          pattern: ^[0-9a-f]{16}$
          description: 'Identificador de llave: primeros 16 caracteres hexadecimales del SHA-256 de la llave pública.'
          examples:
            - 3f9a1c0b7d2e4a68
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 sobre "sigilo/corroboracion/evaluation-count/v1:" + JSON canónico sin la firma.
      required:
        - v
        - day
        - epoch
        - evaluations
        - signingKeyId
        - signature
      additionalProperties: false
      description: 'Conteo diario firmado de evaluaciones: comparado con el número de denuncias, delata una enumeración masiva.'
    EvaluationCountsPage:
      type: object
      properties:
        counts:
          maxItems: 366
          type: array
          items:
            $ref: '#/components/schemas/EvaluationDailyCount'
          description: Conteos firmados, uno por día cerrado.
      required:
        - counts
      additionalProperties: false
      description: Conteos diarios de días cerrados, del más antiguo al más reciente.
    IndexRegistration:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        epoch:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Época de la llave del evaluador con la que se obtuvo la etiqueta.
        tag:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 'Etiqueta de corroboración: HKDF de la salida VOPRF. Es igual para el mismo identificador y la misma época, y no revela cuál es.'
        folioDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 'Digesto opaco del folio (HMAC con un secreto del nodo): solo el nodo lo relaciona con su denuncia.'
        receivedAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:[0-5]0Z$
          description: Fecha y hora redondeada hacia abajo a 10 minutos, en UTC (AAAA-MM-DDTHH:M0Z).
          examples:
            - 2026-11-11T17:20Z
        entry:
          $ref: '#/components/schemas/CorroborationEntry'
        similarity:
          anyOf:
            - type: string
              minLength: 86
              maxLength: 86
              pattern: ^[A-Za-z0-9_-]+$
              description: Bytes en Base64URL sin relleno (RFC 4648, sección 5).
            - type: 'null'
          description: Resumen difuso del relato (512 bits MinHash con llave derivada de la etiqueta) que calculó el navegador, o null si el relato es muy corto. No permite reconstruir el texto.
        custody:
          description: 'true si la denuncia está en custodia (ADR 0006): ve cuántas fuentes confirmadas hay sin estar aceptada. Queda en la bitácora del nodo.'
          type: boolean
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del nodo (llave del directorio) sobre "sigilo/corroboracion/index-registration/v1:" + JSON canónico sin la firma.
      required:
        - v
        - nodeId
        - epoch
        - tag
        - folioDigest
        - receivedAt
        - entry
        - similarity
        - signature
      additionalProperties: false
      description: 'Registro de una denuncia en el índice: etiqueta, nodo, folio opaco y señales de independencia. Nunca el identificador.'
    CorroborationEntry:
      type: string
      enum:
        - relay
        - direct
      description: 'Por dónde llegó la denuncia al nodo: relay (ventanilla única, por el enrutador) o direct (entrada propia del nodo).'
    CorroborationStatus:
      type: object
      properties:
        folioDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
        confirmation:
          $ref: '#/components/schemas/CorroborationConfirmation'
        isRevealed:
          type: boolean
          description: Si el estado incluye el grupo. Solo con la denuncia confirmada, envejecida o en custodia; si no, el estado es el de una denuncia sola, para que registrar no sirva de oráculo.
        groupId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Identificador aleatorio del grupo de la etiqueta (o uno propio de la denuncia mientras no se revela); no se deriva de ella ni dice qué nodos o folios lo forman.
        complaints:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Denuncias de su grupo de origen más las de las fuentes confirmadas; las demás no se cuentan ni se revelan.
        independentSources:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Esta fuente más las otras fuentes confirmadas (aceptadas o envejecidas); las denuncias que parecen de la misma fuente cuentan una vez.
        confirmedOtherSources:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Otras fuentes independientes confirmadas; 0 mientras no se revela. Es lo que libera una custodia.
        sameOriginCount:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Denuncias que cuentan como la misma fuente que esta (ella incluida).
        flags:
          type: array
          items:
            $ref: '#/components/schemas/CorroborationFlag'
          description: Marcas del grupo de origen de esta denuncia; vacío si parece independiente.
        signals:
          type: array
          items:
            $ref: '#/components/schemas/IndependenceSignal'
          description: Señales que agruparon esta denuncia con otras, para explicar el conteo.
      required:
        - folioDigest
        - confirmation
        - isRevealed
        - groupId
        - complaints
        - independentSources
        - confirmedOtherSources
        - sameOriginCount
        - flags
        - signals
      additionalProperties: false
      description: 'Estado de corroboración de una denuncia del nodo: suma prioridad explicable, nunca retrasa, descarta ni cambia su estado.'
    CorroborationConfirmation:
      type: string
      enum:
        - pending
        - confirmed
        - aged
      description: 'Confirmación de la denuncia ante el índice: pending (registrada, sin confirmar), confirmed (el nodo confirmó que la autoridad la aceptó) o aged (pasaron los días de gracia sin confirmación ni baja).'
    IndexConfirmation:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        folioDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Folio opaco ya registrado por el nodo.
        requestedAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:[0-5]0Z$
          description: Hora de la petición; el índice rechaza las que difieren más de 20 minutos.
          examples:
            - 2026-11-11T17:20Z
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del nodo sobre "sigilo/corroboracion/index-confirmation/v1:" + JSON canónico sin la firma.
      required:
        - v
        - nodeId
        - folioDigest
        - requestedAt
        - signature
      additionalProperties: false
      description: El nodo confirma que la autoridad aceptó la denuncia (estado aceptada del trámite). La confirmación queda en la bitácora del nodo.
    IndexWithdrawal:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        folioDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Folio opaco que se retira.
        reason:
          $ref: '#/components/schemas/IndexWithdrawalReason'
        requestedAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:[0-5]0Z$
          description: Hora de la petición; el índice rechaza las que difieren más de 20 minutos.
          examples:
            - 2026-11-11T17:20Z
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del nodo sobre "sigilo/corroboracion/index-withdrawal/v1:" + JSON canónico sin la firma.
      required:
        - v
        - nodeId
        - folioDigest
        - reason
        - requestedAt
        - signature
      additionalProperties: false
      description: 'Baja firmada: el índice borra el registro, recalcula el grupo y no acepta volver a registrar ese folio.'
    IndexWithdrawalReason:
      type: string
      enum:
        - spam
        - inadmissible
        - duplicate
      description: 'Motivo de la baja: spam (envío sin hechos), inadmissible (cerrada como improcedente) o duplicate (acumulada a otra denuncia del mismo nodo).'
    IndexWithdrawalReceipt:
      type: object
      properties:
        folioDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Digesto SHA-256 en hexadecimal minúsculo (64 caracteres).
        withdrawn:
          type: boolean
          const: true
          description: 'Siempre true: la baja quedó aplicada.'
      required:
        - folioDigest
        - withdrawn
      additionalProperties: false
      description: Acuse de la baja.
    CorroborationFlag:
      type: string
      enum:
        - possible_same_origin
        - possible_campaign
      description: 'Marca del grupo de origen: possible_same_origin (parecen de la misma fuente) o possible_campaign (ráfaga de tres o más con textos parecidos). Nunca significa «falsa».'
    IndependenceSignal:
      type: string
      enum:
        - similar_text
        - burst
        - same_node
        - same_entry
      description: 'Señal que unió esta denuncia con otra: similar_text (relatos muy parecidos), burst (misma ventana corta), same_node (mismo nodo), same_entry (misma entrada a la red).'
    IndexNoticesRequest:
      type: object
      properties:
        v:
          type: number
          const: 1
          description: Versión del formato.
        nodeId:
          type: string
          pattern: ^node\.[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Identificador estable del nodo.
          examples:
            - node.queretaro
        after:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Último aviso ya recibido (0 para empezar).
        requestedAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}T\d{2}:[0-5]0Z$
          description: Hora de la petición; el índice rechaza las que difieren más de 20 minutos.
          examples:
            - 2026-11-11T17:20Z
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: Firma Ed25519 del nodo sobre "sigilo/corroboracion/index-notices/v1:" + JSON canónico sin la firma.
      required:
        - v
        - nodeId
        - after
        - requestedAt
        - signature
      additionalProperties: false
      description: Petición firmada de avisos del índice para un nodo.
    IndexNotice:
      type: object
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Número del aviso para este nodo.
        status:
          $ref: '#/components/schemas/CorroborationStatus'
      required:
        - seq
        - status
      additionalProperties: false
      description: 'Aviso: cambió el estado de corroboración de una denuncia del nodo.'
    IndexNoticesPage:
      type: object
      properties:
        notices:
          maxItems: 500
          type: array
          items:
            $ref: '#/components/schemas/IndexNotice'
          description: Avisos en orden de número.
      required:
        - notices
      additionalProperties: false
      description: Avisos pendientes del nodo, del más antiguo al más reciente.
  securitySchemes:
    proofOfWork:
      type: apiKey
      in: header
      name: X-Sigilo-Pow
      description: 'Prueba de trabajo sin cuentas ni rastreo: `X-Sigilo-Pow: <token>:<contador>`, donde `token` viene de `GET /api/v1/pow/challenge` y `SHA-256(token + ":" + contador)` empieza con `bits` bits en cero. Si falta o no es válida, la respuesta es `428 proof_required`.'
    authorityBearer:
      type: http
      scheme: bearer
      description: 'Token de sesión de una cuenta individual de la autoridad (`Authorization: Bearer <token>`), emitido por `POST /api/v1/auth/login`. Vence tras 15 minutos sin actividad o 8 horas en total y se invalida al cerrar sesión. Todo fallo responde el mismo `401`.'
