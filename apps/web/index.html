<!doctype html>
<html lang="es-MX" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      Seguridad: CSP estricta. Todo se sirve desde el propio origen; no hay CDN, fuentes externas
      ni analíticas. En desarrollo, vite.config.ts la relaja solo para el refresco en caliente.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="google" content="notranslate" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="SIGILO: denuncia hechos de corrupción sin revelar quién eres."
    />
    <meta name="theme-color" content="#eef5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#081c18" media="(prefers-color-scheme: dark)" />
    <!--
      Íconos de la marca (docs/marca.md), servidos desde el mismo origen: con ellos declarados el
      navegador tampoco pide /favicon.ico.
    -->
    <link rel="icon" href="/marca/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/marca/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png" />
    <title>SIGILO, denuncia protegida</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Esta aplicación necesita JavaScript porque protege tus datos dentro de tu navegador antes de
      enviarlos.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
